<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统集成项目管理工程师 · 备考助手</title>
<style>
:root{--primary:#2563eb;--primary-light:#3b82f6;--primary-dark:#1d4ed8;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--bg:#f0f4f8;--card:#fff;--text:#1e293b;--text-s:#64748b;--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.app{max-width:900px;margin:0 auto;padding:16px}
.header{text-align:center;padding:20px 0 12px}
.header h1{font-size:1.4rem;font-weight:700;color:var(--primary-dark)}
.header p{color:var(--text-s);font-size:.82rem;margin-top:4px}
.nav{display:flex;gap:4px;padding:6px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:0;z-index:100;margin-bottom:14px}
.nav-btn{flex:none;padding:7px 12px;border:none;border-radius:8px;background:transparent;color:var(--text-s);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-btn:hover{background:var(--bg);color:var(--text)}
.nav-btn.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center}
.stat-num{font-size:1.4rem;font-weight:700}
.stat-label{font-size:.72rem;color:var(--text-s);margin-top:2px}
.progress-bar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-top:6px}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .5s ease}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;margin:2px}
.tag-blue{background:#dbeafe;color:#1d4ed8}.tag-green{background:#dcfce7;color:#166534}
.tag-yellow{background:#fef3c7;color:#92400e}.tag-red{background:#fee2e2;color:#991b1b}.tag-purple{background:#f3e8ff;color:#6b21a8}
.knowledge-category .cat-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--bg);border-radius:8px;cursor:pointer;transition:all .2s}
.knowledge-category .cat-header:hover{background:#dbeafe}
.knowledge-category .cat-header h3{font-size:.88rem;font-weight:600}
.knowledge-category .cat-header .arrow{transition:transform .3s;font-size:.75rem;color:var(--text-s)}
.knowledge-category.open .cat-header .arrow{transform:rotate(90deg)}
.knowledge-category .cat-body{display:none;padding:10px 0}
.knowledge-category.open .cat-body{display:block}
.topic-item{padding:8px 14px;border-left:3px solid var(--border);margin:3px 0;cursor:pointer;transition:all .2s;font-size:.84rem}
.topic-item:hover{border-left-color:var(--primary);background:#f8fafc}
.topic-item.learned{border-left-color:var(--success)}
.topic-item .topic-title{display:flex;justify-content:space-between;align-items:center}
.topic-item .mark-btn{font-size:.7rem;padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:transparent;cursor:pointer;transition:all .2s}
.topic-item .mark-btn:hover{border-color:var(--primary);color:var(--primary)}
.topic-item .mark-btn.marked{background:var(--success);color:#fff;border-color:var(--success)}
.topic-detail{margin-top:6px;padding:10px;background:#f8fafc;border-radius:8px;font-size:.8rem;line-height:1.8;display:none}
.topic-detail h4{font-size:.84rem;color:var(--primary-dark);margin-bottom:4px}
.topic-detail ul{padding-left:16px}.topic-detail li{margin:2px 0}
.topic-detail .formula{background:#fef3c7;padding:1px 6px;border-radius:3px;font-family:monospace;font-size:.78rem}
.topic-detail .key-point{background:#dbeafe;padding:1px 6px;border-radius:3px}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.quiz-option{padding:11px 14px;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;font-size:.84rem}
.quiz-option:hover{border-color:var(--primary-light);background:#f0f7ff}
.quiz-option.selected{border-color:var(--primary);background:#eff6ff}
.quiz-option.correct{border-color:var(--success);background:#ecfdf5}
.quiz-option.wrong{border-color:var(--danger);background:#fef2f2}
.quiz-option .opt-label{font-weight:600;margin-right:6px;color:var(--primary)}
.quiz-explanation{margin-top:10px;padding:10px;background:#f0fdf4;border-left:3px solid var(--success);border-radius:0 8px 8px 0;font-size:.8rem;line-height:1.7;display:none}
.quiz-explanation.show{display:block}
.quiz-explanation.wrong-exp{background:#fef2f2;border-left-color:var(--danger)}
.quiz-nav{display:flex;gap:8px;margin-top:14px}
.quiz-nav button{flex:1;padding:10px;border:none;border-radius:8px;font-size:.84rem;font-weight:500;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--bg);color:var(--text)}.btn-secondary:hover{background:var(--border)}
.btn-success{background:var(--success);color:#fff}.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.quiz-config{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.quiz-config select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.82rem;background:var(--card);cursor:pointer;color:var(--text)}
.quiz-progress{display:flex;gap:2px;margin-bottom:10px;flex-wrap:wrap}
.quiz-dot{width:7px;height:7px;border-radius:50%;background:var(--border)}
.quiz-dot.correct{background:var(--success)}.quiz-dot.wrong{background:var(--danger)}
.quiz-dot.current{background:var(--primary);box-shadow:0 0 4px rgba(37,99,235,.4)}
.case-scenario{background:#f8fafc;border-radius:8px;padding:14px;margin-bottom:10px;border-left:3px solid var(--primary)}
.case-scenario p{font-size:.84rem;line-height:1.8;white-space:pre-line}
.case-question{font-size:.86rem;font-weight:600;margin:10px 0 6px}
.case-answer-area{display:none;margin-top:10px}
.case-answer-area.show{display:block}
.case-reference{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:12px;font-size:.8rem;line-height:1.8}
.case-reference h4{color:var(--success);margin-bottom:4px;font-size:.84rem}
.case-reference p{white-space:pre-line}
.calc-section{margin-bottom:14px}
.calc-form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc-form label{font-size:.78rem;color:var(--text-s)}
.calc-form input{padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:.84rem}
.calc-form input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
.calc-result{margin-top:10px;padding:12px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px}
.calc-result .result-item{display:flex;justify-content:space-between;padding:5px 0;font-size:.84rem;border-bottom:1px solid #e0f2fe}
.calc-result .result-item:last-child{border-bottom:none}
.calc-result .result-label{color:var(--text-s)}
.calc-result .result-value{font-weight:600}
.calc-result .result-value.good{color:var(--success)}.calc-result .result-value.bad{color:var(--danger)}
.calc-result .result-value.warn{color:var(--warning)}
.formula-ref{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:12px;margin-top:10px;font-size:.78rem;line-height:1.9}
.formula-ref h4{color:#92400e;margin-bottom:4px}
.cpm-network{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:10px;min-height:60px;overflow-x:auto}
.cpm-add-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.cpm-add-row input{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:.8rem}
.wrong-item{padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.wrong-item .wrong-q{font-size:.84rem;font-weight:500;margin-bottom:4px}
.wrong-item .wrong-info{font-size:.73rem;color:var(--text-s);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wrong-item .wrong-actions{display:flex;gap:6px;margin-top:6px}
.wrong-item .wrong-actions button{padding:4px 10px;border:1px solid var(--border);border-radius:4px;font-size:.73rem;background:transparent;cursor:pointer}
.plan-today{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px}
.plan-today h3{font-size:.95rem;margin-bottom:6px}
.plan-today .plan-date{font-size:.78rem;opacity:.8}
.plan-checklist .check-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.84rem}
.plan-checklist .check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
.page{display:none}.page.active{display:block}
.timer-display{font-size:2rem;font-weight:700;text-align:center;font-family:monospace;color:var(--primary);padding:14px}
.timer-controls{display:flex;gap:8px;justify-content:center;margin-top:8px}
.process-table{width:100%;font-size:.72rem;border-collapse:collapse;margin-top:6px}
.process-table th,.process-table td{padding:5px 7px;border:1px solid var(--border);text-align:left}
.process-table th{background:var(--primary);color:#fff;font-weight:500}
.process-table td{background:var(--card)}
.process-table tr:hover td{background:#f0f7ff}
.search-box{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:.84rem;margin-bottom:10px}
.search-box:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
.tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:2px solid var(--border)}
.tab-btn{padding:7px 14px;border:none;background:transparent;color:var(--text-s);font-size:.82rem;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 22px;background:#1e293b;color:#fff;border-radius:8px;font-size:.84rem;opacity:0;transition:opacity .3s;z-index:9999;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:600px){.app{padding:10px}.header h1{font-size:1.15rem}.calc-form{grid-template-columns:1fr}.stats-row{grid-template-columns:repeat(2,1fr)}}
.exam-analysis{margin-bottom:8px}.exam-analysis .tag{margin-right:4px}
.memory-tip{background:#fef3c7;padding:6px 10px;border-radius:6px;border-left:3px solid #f59e0b;font-size:.8rem;margin:4px 0}
.example-q{background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:10px;margin:6px 0;font-size:.8rem;line-height:1.8}
.example-q p{margin:2px 0}
.example-ans{color:#166534;font-weight:500;margin-top:4px;padding-top:4px;border-top:1px solid #bae6fd}
.key-concept{background:#dbeafe;padding:2px 6px;border-radius:4px;font-weight:500}
.mock-config{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mock-config select,.mock-config button{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:.82rem;background:var(--card);cursor:pointer}
.mock-header{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:2px solid var(--border);margin-bottom:10px}
.mock-timer{font-size:1.3rem;font-weight:700;font-family:monospace;color:var(--primary)}
.mock-question-num{font-size:.85rem;color:var(--text-s)}
.mock-result{padding:20px;text-align:center}
.mock-result .score{font-size:3rem;font-weight:700;margin:10px 0}
.mock-result .pass{color:var(--success)}.mock-result .fail{color:var(--danger)}
.mock-analysis-bar{display:flex;height:20px;border-radius:10px;overflow:hidden;margin:8px 0}
.mock-analysis-bar div{transition:width .5s}
.mock-review-item{padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:.84rem}
.mock-review-item.wrong-item{border-left:3px solid var(--danger)}
.mock-review-item.correct-item{border-left:3px solid var(--success)}
.mock-review-q{font-weight:500;margin-bottom:4px}
.mock-review-answer{font-size:.8rem;color:var(--text-s);margin-top:4px}
.mock-sheet{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin:10px 0}
.mock-sheet-dot{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:500;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.mock-sheet-dot.answered{background:var(--bg);border-color:var(--primary-light)}
.mock-sheet-dot.current{background:var(--primary);color:#fff;border-color:var(--primary)}
.mock-sheet-dot.correct-dot{background:var(--success);color:#fff}
.mock-sheet-dot.wrong-dot{background:var(--danger);color:#fff}
.section-divider{padding:10px;background:var(--primary);color:#fff;border-radius:8px;margin:14px 0;font-size:.85rem;font-weight:600}
.fc-container{max-width:420px;margin:0 auto;user-select:none}
.fc-card{width:100%;perspective:1000px;cursor:pointer;margin:0 auto}
.fc-card-inner{position:relative;width:100%;padding-top:70%;transition:transform 0.5s;transform-style:preserve-3d}
.fc-card.flipped .fc-card-inner{transform:rotateY(180deg)}
.fc-card-front,.fc-card-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.fc-card-front{background:linear-gradient(135deg,var(--primary),#4f46e5);color:#fff;font-weight:700;font-size:1.05rem;text-align:center;line-height:1.5}
.fc-card-front small{font-size:.72rem;opacity:.7;margin-top:8px;font-weight:400}
.fc-card-back{background:var(--card);border:1px solid var(--border);transform:rotateY(180deg);overflow-y:auto;font-size:.82rem;line-height:1.7;text-align:left;align-items:flex-start;justify-content:flex-start}
.fc-nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.fc-nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background .2s}
.fc-nav button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.fc-nav .fc-progress{font-size:.78rem;color:var(--text-s)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>系统集成项目管理工程师 · 备考助手</h1>
    <p>中级 | 2025/2026 考纲 | 本地存储</p>
  </div>
  <div class="nav" id="mainNav">
    <button class="nav-btn active" onclick="nav('home')">首页</button>
    <button class="nav-btn" onclick="nav('knowledge')">知识点</button>
    <button class="nav-btn" onclick="nav('quiz')">刷题</button>
    <button class="nav-btn" onclick="nav('case')">案例</button>
    <button class="nav-btn" onclick="nav('calc')">计算器</button>
    <button class="nav-btn" onclick="nav('wrong')">错题本</button>
    <button class="nav-btn" onclick="nav('plan')">备考</button>
    <button class="nav-btn" onclick="nav('mock')">模拟</button>
    <button class="nav-btn" onclick="nav('analysis')">分析</button>
    <button class="nav-btn" onclick="nav('formula')">公式</button>
  </div>
  <div class="page active" id="page-home"></div>
  <div class="page" id="page-knowledge"></div>
  <div class="page" id="page-quiz"></div>
  <div class="page" id="page-case"></div>
  <div class="page" id="page-calc"></div>
  <div class="page" id="page-wrong"></div>
  <div class="page" id="page-plan"></div>
  <div class="page" id="page-mock"></div>
  <div class="page" id="page-analysis"></div>
  <div class="page" id="page-formula"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const DB_KEY='si_pm_study_v3';
const getDB=()=>{try{return JSON.parse(localStorage.getItem(DB_KEY))||{}}catch(e){return{}}};
const saveDB=db=>localStorage.setItem(DB_KEY,JSON.stringify(db));
const $=id=>document.getElementById(id);
const toast=msg=>{const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)};

// ===== KNOWLEDGE DATA =====
const KB=[
{id:'信息化基础',title:'信息化基础知识',topics:[
{title:'国家信息化体系六要素',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><h4>六要素</h4><ul><li><span class="key-point">信息技术应用</span> — 主轴，龙头</li><li><span class="key-point">信息资源</span> — 核心任务和核心内容</li><li><span class="key-point">信息网络</span> — 基础设施</li><li><span class="key-point">信息技术和产业</span> — 建设基础</li><li><span class="key-point">信息化人才</span> — 成功之本</li><li><span class="key-point">信息化政策法规和标准规范</span> — 保障</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"应用龙、资源核、网络基、技术撑、人才本、法规保\" — 六字口诀对应六要素</p><h4>例题</h4><div class="example-q"><p>在国家信息化体系中，起到\"龙头\"和\"主轴\"作用的要素是()。</p><p>A.信息资源 B.信息技术应用 C.信息网络 D.信息化人才</p><p class="example-ans">答案：B。信息技术应用是龙头和主轴，信息资源是核心内容，信息网络是基础设施。</p></div>'},
{title:'电子政务',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><h4>电子政务模型</h4><ul><li><span class="key-point">G2G</span>（政府对政府）：办公自动化、公文流转</li><li><span class="key-point">G2B</span>（政府对企业）：电子税务、电子采购</li><li><span class="key-point">G2C</span>（政府对公民）：在线教育、社保</li><li><span class="key-point">G2E</span>（政府对公务员）：内部办公系统</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"政政办、政企税、政民教、政公元\" — G2G办公、G2B税务、G2C教育、G2E公务员</p><h4>例题</h4><div class="example-q"><p>下列哪项属于G2B模式的典型应用？()</p><p>A.在线教育 B.电子税务 C.公文流转 D.内部办公</p><p class="example-ans">答案：B。G2B（政府对企业）包括电子税务和电子采购。在线教育是G2C，公文流转是G2G，内部办公是G2E。</p></div>'},
{title:'企业信息化',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★☆☆☆</span> 选择题</div><h4>企业信息化体系</h4><ul><li><strong>ERP</strong>：核心是MRP\u2161，整合企业资源</li><li><strong>CRM</strong>：客户关系管理</li><li><strong>SCM</strong>：供应链管理</li><li><strong>BPM</strong>：业务流程管理</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"E企整、C客管、S供链、B流程\" — ERP=企业资源计划(整合)、CRM=客户关系、SCM=供应链、BPM=业务流程</p><h4>例题</h4><div class="example-q"><p>企业资源计划(ERP)的核心是()。</p><p>A.CRM B.MRP\u2161 C.BPM D.SCM</p><p class="example-ans">答案：B。ERP的核心是MRP\u2161（制造资源计划），ERP在MRP\u2161基础上扩展了财务、人力资源等功能。</p></div>'},
{title:'信息系统生命周期',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题/案例分析</div><h4>五个阶段</h4><ul><li><span class="key-point">规划</span>：战略规划、可行性研究</li><li><span class="key-point">分析</span>：需求分析、功能分析</li><li><span class="key-point">设计</span>：概要设计、详细设计</li><li><span class="key-point">实施</span>：编码、测试、部署</li><li><span class="key-point">运维</span>：运行维护、变更管理</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"规分设实运\" — 规划、分析、设计、实施、运维，五步走。注意：分析阶段产出需求规格说明书，设计阶段产出系统设计文档。</p><h4>例题</h4><div class="example-q"><p>在信息系统生命周期中，需求分析属于哪个阶段？()</p><p>A.规划阶段 B.分析阶段 C.设计阶段 D.实施阶段</p><p class="example-ans">答案：B。需求分析属于分析阶段，该阶段产出需求规格说明书。规划阶段进行可行性研究，设计阶段进行系统设计。</p></div>'},
]},
{id:'信息系统集成',title:'信息系统集成及服务管理',topics:[
{title:'信息系统集成资质',detail:'<div class="exam-analysis"><span class="tag tag-green">低频考点</span> <span class="tag tag-yellow">★☆☆☆</span> 选择题</div><h4>资质等级（传统分级）</h4><ul><li>一级：国家级项目</li><li>二级：省级项目</li><li>三级：市级项目</li><li>四级：区县级项目</li></ul><p>2025年调整为信息化服务能力评价</p><h4>记忆技巧</h4><p class="memory-tip">口诀：\"一国二省三市四区\" — 数字对应项目级别，从上到下递减</p><h4>例题</h4><div class="example-q"><p>信息系统集成资质中，承担省级项目的企业至少需要()级资质。</p><p>A.一级 B.二级 C.三级 D.四级</p><p class="example-ans">答案：B。一级对应国家级、二级对应省级、三级对应市级、四级对应区县级项目。</p></div>'},
{title:'ITIL服务管理',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><h4>ITIL五阶段</h4><ul><li>战略阶段：服务战略</li><li>设计阶段：服务设计</li><li>转换阶段：服务转换（变更管理核心）</li><li>运营阶段：事件管理、问题管理</li><li>改进阶段：持续服务改进</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"战设转运改\" — ITIL生命周期五阶段。重点是转换阶段包含变更管理，运营阶段区分事件管理(恢复服务)和问题管理(找根因)。</p><h4>例题</h4><div class="example-q"><p>在ITIL服务生命周期中，变更管理属于哪个阶段？()</p><p>A.服务战略 B.服务设计 C.服务转换 D.服务运营</p><p class="example-ans">答案：C。变更管理是服务转换阶段的核心流程。服务运营阶段关注事件管理和问题管理。</p></div>'},
{title:'ITSS标准',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★☆☆☆</span> 选择题</div><h4>ITSS四级能力模型</h4><ul><li>一级（定量改进级）</li><li>二级（协同改进级）</li><li>三级（规范级）</li><li>四级（基本级）</li></ul><p>四要素：<strong>PPTR</strong>（人员、流程、技术、资源）</p><h4>记忆技巧</h4><p class="memory-tip">口诀：\"ITSS四要素PPTR\" — Personnel人员、Process流程、Technology技术、Resource资源。等级从一级(最高)到四级(最低)，与等保相反。</p><h4>例题</h4><div class="example-q"><p>ITSS信息技术服务标准的核心四要素不包括()。</p><p>A.人员 B.流程 C.资金 D.技术</p><p class="example-ans">答案：C。ITSS四要素PPTR：人员(Personnel)、流程(Process)、技术(Technology)、资源(Resource)，不包括资金。</p></div>'},
]},
{id:'法律法规',title:'法律法规与标准规范',topics:[
{title:'招标投标法',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/案例分析</div><h4>核心考点</h4><ul><li><span class="key-point">必须招标</span>：大型基础设施、国有资金项目等</li><li>招标方式：<span class="key-point">公开招标</span>（主要）和邀请招标</li><li>招标文件发售 \u2265 <span class="formula">5个工作日</span></li><li>投标准备时间 \u2265 <span class="formula">20日</span></li><li>评标委员会：<span class="formula">5人以上单数</span>，专家 \u2265 <span class="formula">2/3</span></li><li>中标后 <span class="formula">30日内</span>签订书面合同</li></ul><h4>记忆技巧</h4><p class="memory-tip">数字口诀：\"5天发售、20天投标、5人评标(2/3专家)、30天签合同\" — 520530，时间节点牢记</p><h4>例题</h4><div class="example-q"><p>根据《招标投标法》，依法必须进行招标的项目，自招标文件发出之日起至投标人提交投标文件截止之日止，最短不得少于()。</p><p>A.10日 B.15日 C.20日 D.30日</p><p class="example-ans">答案：C。投标准备时间最短不得少于20日。招标文件发售不少于5个工作日，中标后30日内签订合同。</p></div>'},
{title:'政府采购法',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><h4>采购方式</h4><ul><li><span class="key-point">公开招标</span> — 主要方式</li><li>邀请招标</li><li>竞争性谈判（\u22653家供应商）</li><li>竞争性磋商</li><li>单一来源采购</li><li>询价（\u22653家）</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"公开为主、邀请为辅、谈判磋商需三家、单一询价特殊用\" — 六种方式，公开招标是政府采购的主要方式</p><h4>例题</h4><div class="example-q"><p>根据《政府采购法》，政府采购的主要方式是()。</p><p>A.邀请招标 B.竞争性谈判 C.公开招标 D.单一来源采购</p><p class="example-ans">答案：C。公开招标是政府采购的主要方式。竞争性谈判和询价均要求不少于3家供应商参与。</p></div>'},
{title:'合同法核心',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/案例分析</div><h4>合同类型</h4><ul><li><span class="key-point">固定总价(FFP)</span>：买方风险最小</li><li>总价加激励费用(FPIF)</li><li>成本补偿(CPFF/CPIF)：<span class="formula">CPFF</span>卖方风险最小</li><li>工料合同(T&amp;M)</li></ul><p><span class="key-point">索赔程序</span>：28天通知\u219228天报告\u219228天批复\u2192仲裁/诉讼</p><h4>记忆技巧</h4><p class="memory-tip">索赔口诀：\"28天通知、28天报告、28天批复\" — 三个28天，逾期视为放弃或认可。合同风险：买方FFP最小，卖方CPFF最小。</p><h4>例题</h4><div class="example-q"><p>在项目合同中，对于买方来说风险最小的合同类型是()。</p><p>A.成本加固定费用(CPFF) B.工料合同(T&amp;M) C.固定总价合同(FFP) D.成本加激励费用(CPIF)</p><p class="example-ans">答案：C。固定总价合同(FFP)买方风险最小，价格固定；CPFF卖方风险最小，所有成本由买方承担。</p></div>'},
{title:'网络安全法',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><h4>等级保护</h4><ul><li>等保1-5级（5级最高）</li><li>关键信息基础设施：通信、能源、交通、金融、电子政务等</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"等保五级5最高，关键基建通能交金政\" — 1级自主到5级专控，级别越高保护越严。关键信息基础设施包括通信/能源/交通/金融/电子政务。</p><h4>例题</h4><div class="example-q"><p>根据网络安全等级保护制度，最高保护等级是()。</p><p>A.1级 B.3级 C.4级 D.5级</p><p class="example-ans">答案：D。等级保护共5级，5级最高(专控保护级)，1级最低(自主保护级)。注意与ITSS等级相反。</p></div>'},
{title:'软件知识产权',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><h4>著作权</h4><ul><li>自<span class="key-point">开发完成之日</span>自动产生</li><li>登记非前提，诉讼中起证明作用</li><li>保护期：自然人作者<span class="formula">终生+50年</span></li><li>职务开发默认属单位</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"完成即保护、登记非必要、终生加五十、职务归单位\" — 软件著作权自动获得、非强制登记</p><h4>例题</h4><div class="example-q"><p>某程序员在公司任职期间开发的软件，若无特别约定，著作权属于()。</p><p>A.程序员个人 B.所在单位 C.程序员与单位共有 D.国家</p><p class="example-ans">答案：B。职务开发作品的著作权默认属于单位，除非合同另有约定。注意区分：自然人作者保护期为终生+50年。</p></div>'},
]},
{id:'项目整体管理',title:'项目整体管理',topics:[
{title:'项目章程',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/案例分析</div><h4>项目章程核心内容</h4><ul><li>项目目的和论证理由</li><li>可衡量的目标和成功标准</li><li>高层级需求、边界、可交付成果</li><li>整体项目风险</li><li>里程碑进度计划</li><li>预审财务资源</li><li>关键干系人名单</li><li>项目经理及其权责</li></ul><p><span class="key-point">由项目发起人签发，赋予项目经理调动资源的权力</span></p><h4>记忆技巧</h4><p class="memory-tip">口诀：\"目的目标需成果，风险里程碑资金，干系名单经理权\" — 章程8要素。关键区分：章程是启动输出、由发起人签发；项目管理计划是规划输出。</p><h4>例题</h4><div class="example-q"><p>关于项目章程，以下说法正确的是()。</p><p>A.由项目经理编写 B.由项目发起人签发 C.包含详细WBS D.属于规划过程组输出</p><p class="example-ans">答案：B。项目章程由项目发起人（或授权人）签发，是启动过程组的输出。WBS是规划阶段产物。</p></div>'},
{title:'项目管理计划',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题/案例分析</div><h4>项目管理计划</h4><ul><li>包含所有子管理计划：<span class="key-point">范围、进度、成本、质量、资源、沟通、风险、采购、干系人、变更、配置</span>管理计划</li><li><span class="key-point">三大基准</span>：范围基准、进度基准、成本基准</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"十子计划+三大基准=项目管理计划\" — 十大知识领域+变更和配置=11个子计划，加上范围/进度/成本三大基准。注意：无\"质量基准\"！</p><h4>例题</h4><div class="example-q"><p>项目管理计划包含三大基准，不包括()。</p><p>A.范围基准 B.进度基准 C.质量基准 D.成本基准</p><p class="example-ans">答案：C。三大基准是范围基准、进度基准和成本基准，没有\"质量基准\"。这是一个常见迷惑项。</p></div>'},
{title:'变更控制流程',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★★</span> 选择题/案例分析</div><h4>\u2b50 高频必考：变更控制完整流程</h4><ol><li><span class="key-point">提出变更申请</span>（变更申请人）</li><li><span class="key-point">变更影响分析</span>（项目经理组织评估）</li><li><span class="key-point">CCB审查批准/否决</span></li><li><span class="key-point">实施变更</span>（变更实施人）</li><li><span class="key-point">变更验证</span>（验证人确认）</li><li><span class="key-point">更新配置项/文档</span>（配置管理员）</li><li><span class="key-point">结束变更</span>（归档）</li></ol><p>\u26a0\ufe0f CCB只批准或否决，不提出变更、不实施、不验证</p><h4>记忆技巧</h4><p class="memory-tip">七字口诀：\"申(申请)\u2192析(分析)\u2192批(审批)\u2192施(实施)\u2192验(验证)\u2192更(更新)\u2192结(结束)\" — 记住CCB核心职责：只审批不执行</p><h4>例题</h4><div class="example-q"><p>关于整体变更控制，以下说法错误的是()。</p><p>A.任何干系人都可以提出变更申请 B.CCB负责实施变更 C.变更前需要做影响分析 D.变更后需要更新配置项</p><p class="example-ans">答案：B。CCB只负责批准或否决变更，不负责实施。实施变更由变更实施人负责。变更申请可以由任何干系人提出。</p></div>'},
{title:'整体管理7个过程',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/案例分析</div><ul><li>制定项目章程 — <span class="key-point">启动</span></li><li>制定项目管理计划 — 规划</li><li>指导与管理项目工作 — 执行</li><li>管理项目知识 — 执行</li><li>监控项目工作 — 监控</li><li>实施整体变更控制 — 监控</li><li>结束项目或阶段 — <span class="key-point">收尾</span></li></ul><h4>记忆技巧</h4><p class="memory-tip">分布口诀：\"启1规1执2监2尾1\" — 7个过程覆盖所有5个过程组。注意：整体管理是唯一覆盖全部5个过程组的知识领域。</p><h4>例题</h4><div class="example-q"><p>项目整体管理中，管理项目知识属于()过程组。</p><p>A.启动 B.规划 C.执行 D.监控</p><p class="example-ans">答案：C。管理项目知识与指导与管理项目工作同属于执行过程组。整体管理7过程分布：启动1+规划1+执行2+监控2+收尾1。</p></div>'},
]},
{id:'项目范围管理',title:'项目范围管理',topics:[
{title:'WBS工作分解结构',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/案例分析</div><h4>WBS核心要点</h4><ul><li>遵循<span class="key-point">100%原则</span>（每层100%覆盖上层范围）</li><li>最底层是<span class="key-point">工作包</span>（非活动）</li><li>WBS+WBS词典 = 范围基准组成部分</li></ul><p>\u26a0\ufe0f WBS分解到工作包即可，不需到活动级别</p><h4>记忆技巧</h4><p class="memory-tip">口诀：\"100%全覆盖、工作包到底、不分解到活动\" — WBS三要点。WBS词典描述每个工作包的详细内容/验收标准/负责人</p><h4>例题</h4><div class="example-q"><p>关于WBS分解，以下说法正确的是()。</p><p>A.最底层是活动 B.WBS只需覆盖80%范围 C.WBS+WBS词典构成范围基准组成部分 D.WBS由项目经理独立编制</p><p class="example-ans">答案：C。WBS+WBS词典是范围基准的组成部分。WBS最底层是工作包(非活动)，必须遵循100%原则，应由项目团队共同编制。</p></div>'},
{title:'范围管理6个过程',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/案例分析</div><ul><li>规划范围管理 — 规划</li><li>收集需求 — 规划</li><li>定义范围 — 规划</li><li>创建WBS — 规划</li><li>确认范围 — <span class="key-point">监控</span>（客户验收）</li><li>控制范围 — 监控</li></ul><p>\u26a0\ufe0f 确认范围\u2260质量控制。确认范围关注可交付成果验收，由客户/发起人进行</p><h4>记忆技巧</h4><p class="memory-tip">分布口诀：\"规4监2\" — 6个过程中4个属于规划过程组，2个(确认范围+控制范围)属于监控过程组。注意：确认范围先于质量控制？错！质量控制在前，确认范围在后。</p><h4>例题</h4><div class="example-q"><p>以下哪个过程属于范围管理的监控过程组？()</p><p>A.收集需求 B.创建WBS C.定义范围 D.确认范围</p><p class="example-ans">答案：D。确认范围和控制范围属于监控过程组。其余4个(规划范围管理/收集需求/定义范围/创建WBS)属于规划过程组。</p></div>'},
{title:'确认范围vs控制范围',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/案例分析</div><ul><li><span class="key-point">确认范围</span>：正式验收已完成可交付成果（客户/发起人审查）</li><li><span class="key-point">控制范围</span>：监督范围基准变更（应对范围蔓延）</li></ul><h4>记忆技巧</h4><p class="memory-tip">区分口诀：\"确认=客户验、控制=防蔓延\" — 确认范围是客户验收(重在认可)，控制范围是防止范围蔓延(重在监督)。确认范围vs质量控制：QC在前(内部检查)、确认范围在后(外部验收)</p><h4>例题</h4><div class="example-q"><p>以下关于确认范围和控制范围区别，正确的是()。</p><p>A.确认范围由项目团队内部完成 B.控制范围由客户完成 C.确认范围是正式验收可交付成果 D.两者没有区别</p><p class="example-ans">答案：C。确认范围是由客户/发起人正式验收可交付成果。控制范围是监督范围基准、防止范围蔓延。两者都属于监控过程组。</p></div>'},
]},
{id:'项目进度管理',title:'项目进度管理',topics:[
{title:'关键路径法(CPM)',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★★</span> 选择题/案例分析/计算</div><h4>\u2b50 必考计算</h4><ul><li><span class="formula">ES = max(前置EF)</span></li><li><span class="formula">EF = ES + 工期</span></li><li><span class="formula">LF = min(后置LS)</span></li><li><span class="formula">LS = LF - 工期</span></li><li><span class="formula">总浮动TF = LS-ES = LF-EF</span></li><li><span class="formula">自由浮动FF = ES(后置) - EF(当前)</span></li></ul><p><span class="key-point">关键路径：TF=0的路径，项目最短工期</span></p><h4>记忆技巧</h4><p class="memory-tip">CPM三步走：\"正推ES/EF(取最大)、逆推LF/LS(取最小)、浮动TF=LS-ES\"。关键路径=TF=0的活动序列，总工期=关键路径上活动工期之和。</p><h4>例题</h4><div class="example-q"><p>某活动A的ES=5，EF=10，后置活动B的ES=12，则活动A的自由浮动时间FF为()。</p><p>A.0 B.2 C.5 D.7</p><p class="example-ans">答案：B。FF=ES(B)-EF(A)=12-10=2。注意区分FF(自由浮动)和TF(总浮动)：TF=LS-ES=LF-EF。</p></div>'},
{title:'进度压缩',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><h4>两种技术</h4><ul><li><span class="key-point">赶工(Crashing)</span>：增加资源，成本增、工期缩</li><li><span class="key-point">快速跟进(Fast-tracking)</span>：并行执行，风险增</li></ul><h4>记忆技巧</h4><p class="memory-tip">对比口诀：\"赶工加钱、快速加险\" — 赶工=加资源(花钱)缩工期；快速跟进=并行(冒险)缩工期。赶工只对关键路径上的活动有效。</p><h4>例题</h4><div class="example-q"><p>项目经理发现项目进度滞后，决定将原本串行执行的活动改为并行执行，这属于()。</p><p>A.赶工 B.快速跟进 C.资源平衡 D.关键链法</p><p class="example-ans">答案：B。快速跟进是将顺序活动改为并行或部分并行执行，可能增加返工风险。赶工是通过增加资源缩短工期。</p></div>'},
{title:'三点估算(PERT)',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/计算</div><ul><li><span class="formula">tE = (O + 4M + P) / 6</span></li><li><span class="formula">\u03c3 = (P - O) / 6</span></li><li>\u00b11\u03c3: 68% | \u00b12\u03c3: 95% | \u00b13\u03c3: 99.7%</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"(O+4M+P)/6求期望，(P-O)/6求标准差，\u00b11\u03c368%、\u00b12\u03c395%、\u00b13\u03c399.7%\" — 公式牢记。tE是加权平均，最可能值M权重最大(4倍)。</p><h4>例题</h4><div class="example-q"><p>某活动乐观时间8天，最可能时间11天，悲观时间20天，则期望工期和标准差为()。</p><p>A.tE=11,\u03c3=2 B.tE=12,\u03c3=2 C.tE=12,\u03c3=3 D.tE=11,\u03c3=3</p><p class="example-ans">答案：B。tE=(8+4\u00d711+20)/6=(8+44+20)/6=72/6=12天；\u03c3=(20-8)/6=12/6=2天。</p></div>'},
{title:'进度管理7个过程',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><ul><li>规划进度管理、定义活动、排列活动顺序、估算持续时间、制定进度计划 — 规划</li><li>控制进度 — <span class="key-point">监控</span></li></ul><h4>记忆技巧</h4><p class="memory-tip">分布口诀：\"规5监1\" — 注意进度管理实际上是6个过程（非7个）：规划进度管理+定义活动+排列活动顺序+估算活动持续时间+制定进度计划(5个规划)+控制进度(1个监控)=6个。</p><h4>例题</h4><div class="example-q"><p>项目进度管理共有()个过程。</p><p>A.4 B.5 C.6 D.7</p><p class="example-ans">答案：C。进度管理共6个过程：5个规划(规划进度/定义活动/排列顺序/估算时间/制定进度)+1个监控(控制进度)。</p></div>'},
]},
{id:'项目成本管理',title:'项目成本管理',topics:[
{title:'挣值管理三大参数',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★★</span> 选择题/计算</div><ul><li><span class="formula">PV(计划值)</span>：计划应完成工作的预算</li><li><span class="formula">EV(挣值) = BAC \u00d7 完成百分比</span></li><li><span class="formula">AC(实际成本)</span>：实际花费</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"PV计划做、EV实际做、AC实际花\" — PV是应按计划完成的工作值，EV是实际完成工作按预算计价，AC是实际花出去的钱</p><h4>例题</h4><div class="example-q"><p>某项目总预算BAC=100万，当前完成了40%的工作，实际花费50万，则EV为()。</p><p>A.40万 B.50万 C.100万 D.60万</p><p class="example-ans">答案：A。EV=BAC\u00d7完成百分比=100\u00d740%=40万。AC=50万(实际花费)。EV\u2260AC。</p></div>'},
{title:'偏差与指数',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★★</span> 选择题/计算</div><ul><li><span class="formula">CV = EV - AC</span> 正=节约 负=超支</li><li><span class="formula">SV = EV - PV</span> 正=超前 负=滞后</li><li><span class="formula">CPI = EV/AC</span> &gt;1节约 &lt;1超支</li><li><span class="formula">SPI = EV/PV</span> &gt;1超前 &lt;1落后</li></ul><p><span class="key-point">口诀：偏差看正负，指数看1。正/大于1是好事</span></p><h4>记忆技巧</h4><p class="memory-tip">一句话记全部：\"C成本S进度、V偏差I指数、EV总是被减数/分子\" — 所有公式中EV都在前面/上面。偏差>0好，指数>1好。</p><h4>例题</h4><div class="example-q"><p>某项目EV=80万，AC=100万，PV=90万，则CV和SV分别为()。</p><p>A.CV=-20,SV=10 B.CV=20,SV=-10 C.CV=-20,SV=-10 D.CV=10,SV=-20</p><p class="example-ans">答案：C。CV=EV-AC=80-100=-20万(超支)；SV=EV-PV=80-90=-10万(滞后)。项目成本超支且进度滞后。</p></div>'},
{title:'完工预测',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★★</span> 选择题/计算</div><h4>非典型（纠偏）</h4><ul><li><span class="formula">ETC = BAC - EV</span></li><li><span class="formula">EAC = AC + BAC - EV</span></li></ul><h4>典型（不纠偏，默认）</h4><ul><li><span class="formula">ETC = (BAC-EV) / CPI</span></li><li><span class="formula">EAC = BAC / CPI</span></li></ul><p><span class="key-point">默认按典型算，除非题目说纠偏</span></p><h4>记忆技巧</h4><p class="memory-tip">区分口诀：纠偏=EAC=AC+(BAC-EV)；不纠偏=EAC=BAC/CPI。典型偏差基于当前CPI持续、非典型假设后续按计划执行。TCPI=(BAC-EV)/(BAC-AC)用于判断剩余工作绩效要求。</p><h4>例题</h4><div class="example-q"><p>项目BAC=200万，EV=120万，AC=150万，CPI=0.8。按典型偏差，完工估算EAC为()。</p><p>A.200万 B.230万 C.250万 D.270万</p><p class="example-ans">答案：C。典型EAC=BAC/CPI=200/0.8=250万。非典型EAC=AC+BAC-EV=150+200-120=230万。</p></div>'},
{title:'储备分析',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/案例分析</div><ul><li><span class="key-point">应急储备</span>：纳入成本基准，PM可支配</li><li><span class="key-point">管理储备</span>：不纳入成本基准，管理层控制</li></ul><h4>记忆技巧</h4><p class="memory-tip">区分口诀：\"应急在基准PM控、管理在基准外高层批\" — 应急=已知-未知(PM可直接使用)，管理=未知-未知(需管理层批准，纳入基准后才能用)</p><h4>例题</h4><div class="example-q"><p>关于管理储备的正确说法是()。</p><p>A.纳入成本基准 B.PM可自由支配 C.使用需要变更成本基准 D.用于应对已知-未知风险</p><p class="example-ans">答案：C。管理储备不纳入成本基准，使用时需管理层批准并通过变更将其纳入成本基准。应急储备用于已知-未知风险，PM可支配。</p></div>'},
]},
{id:'项目质量管理',title:'项目质量管理',topics:[
{title:'七大基本质量工具',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/案例分析</div><ul><li><span class="key-point">因果图(鱼骨图)</span>：分析根本原因</li><li><span class="key-point">流程图</span>：过程分析</li><li><span class="key-point">核查表</span>：收集数据</li><li><span class="key-point">直方图</span>：数据分布</li><li><span class="key-point">帕累托图</span>：二八定律</li><li><span class="key-point">散点图</span>：变量关系</li><li><span class="key-point">控制图</span>：过程稳定性</li></ul><h4>记忆技巧</h4><p class="memory-tip">七字口诀：\"因(因果)流(流程)核(核查)直(直方)帕(帕累托)散(散点)控(控制)\"。类别记忆：查因(因果/散点/帕累托)、看过程(流程图/控制图)、收数据(核查表/直方图)</p><h4>例题</h4><div class="example-q"><p>在质量管理中，按发生频率排序以识别少数关键问题原因的工具是()。</p><p>A.鱼骨图 B.控制图 C.帕累托图 D.散点图</p><p class="example-ans">答案：C。帕累托图基于二八定律，80%问题由20%原因引起。鱼骨图分析根本原因，控制图判断过程是否稳定。</p></div>'},
{title:'质量成本',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><ul><li><span class="key-point">一致性成本</span>：预防（培训）+ 评估（测试）</li><li><span class="key-point">非一致性成本</span>：内部失败（返工）+ 外部失败（保修）</li></ul><h4>记忆技巧</h4><p class="memory-tip">区分口诀：\"一致=主动花钱保质量(预防+评估)，非一致=被动花钱补漏洞(返工+保修)\" — 一致性成本投入越多，非一致性成本就越少</p><h4>例题</h4><div class="example-q"><p>以下属于非一致性成本的是()。</p><p>A.质量培训 B.测试设备 C.产品返工 D.过程审计</p><p class="example-ans">答案：C。返工属于内部失败成本，是非一致性成本。培训属于预防成本，测试/审计属于评估成本，都是(一致性成本)。</p></div>'},
{title:'PDCA循环',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★☆☆☆</span> 选择题</div><ul><li><span class="key-point">P</span>(Plan)规划质量管理</li><li><span class="key-point">D</span>(Do)实施质量保证</li><li><span class="key-point">C</span>(Check)质量控制</li><li><span class="key-point">A</span>(Act)过程改进</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"P规划D保证C控制A改进\" — PDCA与质量管理三过程对应：P=规划质量管理、D=管理质量(质量保证)、C=控制质量、A=持续改进</p><h4>例题</h4><div class="example-q"><p>在PDCA循环中，质量控制对应的是()阶段。</p><p>A.Plan B.Do C.Check D.Act</p><p class="example-ans">答案：C。C(Check)=控制质量，检查可交付成果是否符合标准。D(Do)=管理质量/质量保证，A(Act)=过程改进。</p></div>'},
]},
{id:'项目资源管理',title:'项目资源管理',topics:[
{title:'塔克曼团队发展阶段',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><ul><li><span class="key-point">形成期</span>(Forming)：组建</li><li><span class="key-point">震荡期</span>(Storming)：冲突</li><li><span class="key-point">规范期</span>(Norming)：协作</li><li><span class="key-point">成熟期</span>(Performing)：高效</li><li><span class="key-point">解散期</span>(Adjourning)</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀：\"形震规范成解\" — 形成(见面相识)、震荡(发生冲突)、规范(建立规则)、成熟(高效协作)、解散(任务完成)。五阶段不可跳过但可快速通过</p><h4>例题</h4><div class="example-q"><p>塔克曼模型中，团队成员因工作方式不同产生意见冲突主要发生在()。</p><p>A.形成期 B.震荡期 C.规范期 D.成熟期</p><p class="example-ans">答案：B。震荡期(Storming)是团队冲突集中爆发的阶段，项目经理需要通过介入和引导帮助团队度过该阶段。</p></div>'},
{title:'激励理论',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题</div><ul><li><span class="key-point">马斯洛</span>：生理\u2192安全\u2192社交\u2192尊重\u2192自我实现</li><li><span class="key-point">赫茨伯格双因素</span>：保健因素（不满原因）+ 激励因素（满意原因）</li><li><span class="key-point">期望理论</span>：激励力 = 期望值 \u00d7 效价</li><li><span class="key-point">X/Y理论</span>：X=人性本懒（监督）；Y=人性本勤（放权）</li></ul><h4>记忆技巧</h4><p class="memory-tip">四理论口诀：\"马(马斯洛)需五层从低高、赫(赫茨伯格)保不满激满意、弗(弗鲁姆)激励等于期望乘效价、麦(麦格雷戈)X懒需管Y勤可放\"。关键区分：保健因素(薪酬/条件)不满足会不满但满足不激励；激励因素(认可/成长)满足才会激发动力。</p><h4>例题</h4><div class="example-q"><p>根据赫茨伯格双因素理论，以下属于激励因素的是()。</p><p>A.工资 B.工作条件 C.成就感 D.公司政策</p><p class="example-ans">答案：C。成就感属于激励因素(内在满足)，工资/工作条件/公司政策属于保健因素(外在条件)。</p></div>'},
]},
{id:'项目沟通管理',title:'项目沟通管理',topics:[
{title:'沟通渠道计算',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题/计算</div><span class="formula">沟通渠道数 = n(n-1)/2</span><p>\u26a0\ufe0f PM也算一个干系人！"10个项目成员"可能是11人（含PM）</p><h4>记忆技巧</h4><p class="memory-tip">公式口诀：n人沟通渠道=n(n-1)/2，类似握手问题。注意审题：含不含PM？新增人员后渠道增量 = 新渠道数 - 旧渠道数</p><h4>例题</h4><div class="example-q"><p>某项目团队原有8人(含PM)，新加入2人，沟通渠道增加了()条。</p><p>A.15 B.17 C.19 D.21</p><p class="example-ans">答案：B。原渠道=8x7/2=28条；新人后10人=10x9/2=45条；增加=45-28=17条。注意：务必确认总人数是否含PM。</p></div>'},
{title:'沟通方式',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><ul><li><span class="key-point">交互式</span>（会议/电话）— 最有效</li><li><span class="key-point">推式</span>（邮件/报告）— 确保发送不确保接收</li><li><span class="key-point">拉式</span>（知识库/公告栏）— 大量信息</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀："交互最有效、推送单方向、拉取自己看" — 交互式=双向(最有效)、推式=发送方主动(不管看不看)、拉式=接收方主动(大量信息自行查阅)</p><h4>例题</h4><div class="example-q"><p>项目经理向全公司发布项目月报，这属于()沟通方式。</p><p>A.交互式 B.推式 C.拉式 D.正式</p><p class="example-ans">答案：B。推送邮件/报告是推式沟通的特征。交互式需要双向交流(如会议)，拉式是信息存储在知识库供人查阅。</p></div>'},
]},
{id:'项目风险管理',title:'项目风险管理',topics:[
{title:'风险应对策略',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题/案例分析</div><h4>威胁应对</h4><ul><li><span class="key-point">规避</span>：改变计划消除威胁</li><li><span class="key-point">转移</span>：保险/外包/保函</li><li><span class="key-point">减轻</span>：降低概率和影响</li><li><span class="key-point">接受</span>：主动（应急储备）或被动</li></ul><h4>机会应对</h4><ul><li><span class="key-point">开拓</span>：确保发生</li><li><span class="key-point">分享</span>：分配给第三方</li><li><span class="key-point">提高</span>：增加概率</li><li><span class="key-point">接受</span>：利用时再行动</li></ul><h4>记忆技巧</h4><p class="memory-tip">威胁口诀："规避移减接"，机会口诀："开拓分享高接"。区分：转移=外包/保险(第三方承担)、减轻=降低概率和影响(不转移给第三方)</p><h4>例题</h4><div class="example-q"><p>项目团队发现技术方案存在重大风险，决定改用成熟的技术方案，这属于()策略。</p><p>A.转移 B.减轻 C.规避 D.接受</p><p class="example-ans">答案：C。规避是改变计划完全消除威胁。减轻是降低概率或影响但不消除，转移是交给第三方(如买保险)。</p></div>'},
{title:'风险管理7个过程',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题</div><ul><li>规划风险管理、识别风险、定性分析、定量分析、规划应对 — <span class="key-point">规划</span></li><li>实施风险应对 — 执行</li><li>监督风险 — 监控</li></ul><h4>记忆技巧</h4><p class="memory-tip">分布口诀："规5执1监1" — 风险7过程是规划过程组最多的知识领域之一。注意：定性分析=主观评估概率/影响排序，定量分析=数值化评估(EMV/决策树/蒙特卡洛)</p><h4>例题</h4><div class="example-q"><p>风险管理中，唯一属于执行过程组的过程是()。</p><p>A.识别风险 B.定性风险分析 C.实施风险应对 D.监督风险</p><p class="example-ans">答案：C。实施风险应对是执行过程组唯一的风险过程。识别/定性/定量/规划应对都属于规划过程组，监督风险属于监控过程组。</p></div>'},
]},
{id:'项目采购管理',title:'项目采购管理',topics:[
{title:'合同类型选择',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题/案例分析</div><ul><li><span class="key-point">FFP(固定总价)</span>：买方风险最小</li><li>FPIF(总价+激励)</li><li><span class="key-point">CPFF(成本+固定费)</span>：卖方风险最小</li><li>CPIF(成本+激励)</li><li>T&amp;M(工料合同)</li></ul><h4>记忆技巧</h4><p class="memory-tip">风险口诀："买方怕风险选FFP、卖方怕风险选CPFF" — FFP固定价格买方风险最小，CPFF实报实销加固定费卖方风险最小。工料合同T&M适合范围不确定的小项目。</p><h4>例题</h4><div class="example-q"><p>项目范围非常明确且不易变更时，最适合的合同类型是()。</p><p>A.CPFF B.工料合同 C.FFP D.CPIF</p><p class="example-ans">答案：C。范围明确时选择固定总价合同(FFP)最合适。范围不确定时应选成本补偿(CP)或工料合同。</p></div>'},
{title:'采购文件',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★☆☆☆</span> 选择题</div><ul><li><span class="key-point">RFP</span>(建议书邀请)：复杂采购</li><li><span class="key-point">RFQ</span>(报价邀请)：标准商品</li><li>IFB(投标邀请)：正式招标</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀："RFP复杂要方案、RFQ标准报个价、IFB正式招标用" — RFP=Request for Proposal(要有方案)、RFQ=Request for Quotation(只要报价)、IFB=Invitation for Bid(投标邀请)</p><h4>例题</h4><div class="example-q"><p>采购计算机标准设备，最合适的采购文件是()。</p><p>A.RFP B.RFQ C.IFB D.SOW</p><p class="example-ans">答案：B。RFQ适用于标准商品采购，只需报价不需方案。RFP适用于需要方案说明的复杂采购。</p></div>'},
]},
{id:'项目干系人管理',title:'项目干系人管理',topics:[
{title:'权力/利益方格',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题/案例分析</div><ul><li><span class="key-point">权力高/利益高</span>：重点管理</li><li><span class="key-point">权力高/利益低</span>：令其满意</li><li><span class="key-point">权力低/利益高</span>：随时告知</li><li><span class="key-point">权力低/利益低</span>：监督</li></ul><h4>记忆技巧</h4><p class="memory-tip">四象限口诀："高权高利重点管、高权低利令满意、低权高利常告知、低权低利监督之" — 注意区分："令其满意"是被动满足(高权低利)，"随时告知"是主动沟通(低权高利)</p><h4>例题</h4><div class="example-q"><p>某政府部门对项目成果高度关注但不直接参与，按权力/利益方格应采用的策略是()。</p><p>A.重点管理 B.令其满意 C.随时告知 D.监督</p><p class="example-ans">答案：C。该部门利益高但权力相对较低，应采用随时告知策略。高权高利才是重点管理。</p></div>'},
{title:'识别干系人',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><h4>核心考点</h4><p><span class="key-point">唯一属于启动过程组的干系人管理过程</span></p><p>干系人管理4过程分布：识别干系人(启动)、规划干系人参与(规划)、管理干系人参与(执行)、监督干系人参与(监控)</p><h4>记忆技巧</h4><p class="memory-tip">口诀："启1规1执1监1" — 与整合管理并列，干系人管理是唯一另一个有启动过程的知识领域。记住：除整合管理(启动+收尾)外，其他领域都无启动/收尾过程。</p><h4>例题</h4><div class="example-q"><p>识别干系人属于()过程组。</p><p>A.启动 B.规划 C.执行 D.监控</p><p class="example-ans">答案：A。识别干系人是唯一属于启动过程组的干系人管理过程，与制定项目章程一起构成启动过程组的2个过程。</p></div>'},
]},
{id:'技术基础',title:'信息系统技术基础',topics:[
{title:'OSI七层模型',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><ul><li>7. <span class="key-point">应用层</span>：HTTP/FTP/SMTP/DNS</li><li>6. 表示层：格式转换/加密</li><li>5. 会话层</li><li>4. <span class="key-point">传输层</span>：TCP/UDP</li><li>3. <span class="key-point">网络层</span>：IP/路由器</li><li>2. 数据链路层：交换机/MAC</li><li>1. 物理层：比特流/集线器</li></ul><p>口诀："应表会传网数物"</p><h4>记忆技巧</h4><p class="memory-tip">七字口诀："应表会传网数物"（从7到1）。关键层次设备：应用层=HTTP/网关、传输层=TCP/UDP(端到端)、网络层=IP/路由器、数据链路层=MAC/交换机、物理层=比特流/集线器。</p><h4>例题</h4><div class="example-q"><p>TCP协议工作在OSI模型的()层。</p><p>A.应用层 B.网络层 C.传输层 D.数据链路层</p><p class="example-ans">答案：C。TCP/UDP是传输层协议，IP是网络层协议，HTTP是应用层协议。口诀：传输有TCP，网络有IP。</p></div>'},
{title:'软件开发模型',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><ul><li><strong>瀑布</strong>：线性，需求明确</li><li><strong>增量</strong>：分批交付</li><li><strong>迭代</strong>：每轮全流程</li><li><strong>螺旋</strong>：迭代+风险分析</li><li><strong>V模型</strong>：开发测试对应</li><li><strong>敏捷</strong>：Scrum/XP/Kanban</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀："瀑布=需求明确一条线、增量=分批交付逐步加、迭代=每轮全流程、螺旋=迭代+风险、V=测试对应开发、敏捷=拥抱变化快速交付"。螺旋模型核心特征是"风险分析"。</p><h4>例题</h4><div class="example-q"><p>螺旋模型相比其他模型最大的特点是()。</p><p>A.快速交付 B.风险分析 C.分批交付 D.拥抱变化</p><p class="example-ans">答案：B。螺旋模型最大的特点是将风险分析纳入每个迭代周期。快速交付是增量/敏捷的特点。</p></div>'},
{title:'软件测试',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><ul><li>单元\u2192集成\u2192系统\u2192验收</li><li><span class="key-point">\u03b1测试</span>：开发环境；<span class="key-point">\u03b2测试</span>：用户环境</li><li>黑盒：等价类/边界值/状态转换</li><li>白盒：语句/分支/条件/路径覆盖</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀："单集系验四段走，内黑外白两方法" — 黑盒=不看内部(等价类/边界值)、白盒=看代码逻辑(语句/分支/条件/路径)。V模型对应：单元测试\u2192集成测试\u2192系统测试\u2192验收测试</p><h4>例题</h4><div class="example-q"><p>等价类划分和边界值分析属于()测试方法。</p><p>A.白盒测试 B.黑盒测试 C.单元测试 D.集成测试</p><p class="example-ans">答案：B。等价类划分和边界值分析是典型的黑盒测试方法。语句覆盖/分支覆盖是白盒测试方法。</p></div>'},
{title:'数据库基础',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><ul><li><span class="key-point">三大范式</span>：1NF不可再分、2NF消除部分依赖、3NF消除传递依赖</li><li><span class="key-point">ACID</span>：原子性、一致性、隔离性、持久性</li><li>SQL：DDL/DML/DCL/DQL</li></ul><h4>记忆技巧</h4><p class="memory-tip">范式口诀："1NF拆原子、2NF拆部分依赖、3NF拆传递依赖" — 范式越高冗余越低。ACID口诀："原子的A、一致的C、隔离的I、持久的D"，注意CIA(机密/完整/可用)与ACID(原子/一致/隔离/持久)不要混淆。</p><h4>例题</h4><div class="example-q"><p>数据库事务的ACID特性中，要求事务执行前后数据保持一致状态的是()。</p><p>A.原子性 B.一致性 C.隔离性 D.持久性</p><p class="example-ans">答案：B。一致性确保事务将数据库从一个一致状态转换到另一个一致状态。原子性=全做或全不做。</p></div>'},
{title:'信息安全',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题</div><ul><li>三要素：<span class="key-point">机密性、完整性、可用性</span>(CIA)</li><li>对称加密(AES/DES)、非对称(RSA)</li><li>防火墙、IDS、IPS</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀："CIA不能忘、对称AES快非对称RSA安全、防火墙挡IDS检测IPS阻断" — 注意CIA不要与ACID混淆。IDS=检测告警，IPS=检测+阻断。</p><h4>例题</h4><div class="example-q"><p>信息安全三要素CIA不包括()。</p><p>A.机密性 B.完整性 C.隔离性 D.可用性</p><p class="example-ans">答案：C。CIA=Confidentiality(机密)、Integrity(完整)、Availability(可用)。隔离性(Isolation)是ACID中的I。</p></div>'},
{title:'新型技术',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★☆☆☆</span> 选择题</div><ul><li><strong>云计算</strong>：IaaS/PaaS/SaaS</li><li><strong>大数据</strong>：5V特征</li><li><strong>物联网</strong>：感知/网络/应用</li><li><strong>区块链</strong>：去中心化、不可篡改</li><li><strong>SOA</strong>：面向服务架构</li></ul><h4>记忆技巧</h4><p class="memory-tip">口诀："IaaS基础设施、PaaS开发平台、SaaS软件应用" — 三层递进：从下到上封装越来越多。大数据5V=Volume(大量)/Velocity(高速)/Variety(多样)/Value(价值)/Veracity(真实)。</p><h4>例题</h4><div class="example-q"><p>云计算服务模型中，提供操作系统、数据库和中间件的是()。</p><p>A.IaaS B.PaaS C.SaaS D.DaaS</p><p class="example-ans">答案：B。PaaS提供开发平台(含OS/数据库/中间件)。IaaS仅提供虚拟机/存储/网络，SaaS直接提供软件应用。</p></div>'},
{title:'敏捷开发方法',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★☆☆</span> 选择题</div><h4>Scrum框架</h4><ul><li><span class="key-point">三大角色</span>：Product Owner(产品负责人)、Scrum Master(敏捷教练)、Development Team(开发团队)</li><li>核心工作单元：<span class="key-point">Sprint/迭代</span>，通常1-4周</li><li>四个会议：Sprint Planning(计划会)、Sprint Review(评审会)、Sprint Retrospective(回顾会)、Daily Standup(每日站会)</li></ul><h4>XP极限编程</h4><ul><li><span class="key-point">结对编程</span>：两个人共享同一台计算机</li><li><span class="key-point">测试驱动开发(TDD)</span>：先写测试再写代码</li><li><span class="key-point">持续集成</span>：频繁将代码集成到主干</li><li><span class="key-point">重构</span>：在保持外部行为的前提下改进内部结构</li></ul><h4>Kanban看板</h4><ul><li><span class="key-point">可视化工作流</span>：用看板显示任务状态</li><li><span class="key-point">WIP限制</span>：限制进行中的工作数量</li><li><span class="key-point">拉动式</span>：下游任务完成后拉取上游任务</li></ul><h4>敏捷宣言4个核心价值观</h4><ul><li>个体和互动<span class="key-point">高于</span>流程和工具</li><li>可工作的软件<span class="key-point">高于</span>详尽的文档</li><li>客户合作<span class="key-point">高于</span>合同谈判</li><li>响应变化<span class="key-point">高于</span>遵循计划</li></ul><h4>记忆技巧</h4><p class="memory-tip">敏捷宣言口诀："个体高于流程、软件高于文档、合作高于谈判、变化高于计划" — 四点记住：人>流程、产品>文档、客户>合同、适应>计划。Scrum三角色：PO管需求、SM管过程、Team管开发。</p><h4>例题</h4><div class="example-q"><p>在Scrum框架中，负责管理Product Backlog并确定优先级的是()。</p><p>A.Scrum Master B.开发团队 C.Product Owner D.项目经理</p><p class="example-ans">答案：C。Product Owner(PO)负责产品待办列表的管理和优先级排序。Scrum Master负责团队遵守Scrum流程和移除障碍。</p></div>'},
{title:'信息系统安全',detail:'<div class="exam-analysis"><span class="tag tag-yellow">中频考点</span> <span class="tag tag-yellow">★★★☆</span> 选择题</div><h4>安全等级保护(等保2.0)</h4><ul><li><span class="key-point">1级</span>：自主保护级</li><li><span class="key-point">2级</span>：指导保护级</li><li><span class="key-point">3级</span>：监督保护级</li><li><span class="key-point">4级</span>：强制保护级</li><li><span class="key-point">5级</span>：专控保护级</li></ul><h4>常见攻击</h4><ul><li><span class="key-point">DDoS</span>：分布式拒绝服务攻击</li><li><span class="key-point">SQL注入</span>：通过输入恶意SQL语句获取数据</li><li><span class="key-point">XSS</span>：跨站脚本攻击</li><li><span class="key-point">钓鱼</span>：通过伪装合法实体获取敏感信息</li></ul><h4>安全技术</h4><ul><li><span class="key-point">防火墙</span>：包过滤/状态检测/应用层防火墙</li><li><span class="key-point">IDS</span>：入侵检测系统（检测并告警）</li><li><span class="key-point">IPS</span>：入侵防御系统（检测并阻断）</li><li><span class="key-point">VPN</span>：虚拟专用网络</li></ul><h4>密码技术</h4><ul><li><span class="key-point">对称加密</span>：AES/DES/3DES（加密解密用同一密钥）</li><li><span class="key-point">非对称加密</span>：RSA（公钥加密，私钥解密）</li><li><span class="key-point">数字签名</span>：私钥签名，公钥验证（防否认）</li><li><span class="key-point">数字证书</span>：由CA颁发，绑定公钥和身份</li><li><span class="key-point">CA</span>：证书认证中心（Certificate Authority）</li></ul><h4>记忆技巧</h4><p class="memory-tip">安全口诀："防火墙挡、IDS检、IPS阻、VPN通道、对称快非对称安、数字签名防抵赖"。等保等级口诀："1自主2指导3监督4强制5专控" — 与ITSS等级方向相反。</p><h4>例题</h4><div class="example-q"><p>在网络安全中，既能检测入侵行为又能主动阻断攻击的设备是()。</p><p>A.防火墙 B.IDS C.IPS D.VPN</p><p class="example-ans">答案：C。IPS(入侵防御系统)兼具检测和阻断功能。IDS只能检测告警不能阻断，防火墙按规则过滤。</p></div>'},
]},

{title:'十五至尊图',detail:'<div class="exam-analysis"><span class="tag tag-red">高频考点</span> <span class="tag tag-yellow">★★★★★</span> 选择题/案例分析</div><table class="process-table"><tr><th>知识领域</th><th>启动</th><th>规划</th><th>执行</th><th>监控</th><th>收尾</th></tr><tr><td>整合(7)</td><td>制定章程</td><td>制定计划</td><td>指导与管理<br>管理知识</td><td>监控工作<br>整体变更控制</td><td>结束项目</td></tr><tr><td>范围(6)</td><td>-</td><td>规划范围<br>收集需求<br>定义范围<br>创建WBS</td><td>-</td><td>确认范围<br>控制范围</td><td>-</td></tr><tr><td>进度(6)</td><td>-</td><td>规划进度<br>定义活动<br>排列顺序<br>估算时间<br>制定进度</td><td>-</td><td>控制进度</td><td>-</td></tr><tr><td>成本(4)</td><td>-</td><td>规划成本<br>估算成本<br>制定预算</td><td>-</td><td>控制成本</td><td>-</td></tr><tr><td>质量(3)</td><td>-</td><td>规划质量</td><td>管理质量</td><td>控制质量</td><td>-</td></tr><tr><td>资源(6)</td><td>-</td><td>规划资源<br>估算资源</td><td>获取资源<br>建设团队<br>管理团队</td><td>控制资源</td><td>-</td></tr><tr><td>沟通(3)</td><td>-</td><td>规划沟通</td><td>管理沟通</td><td>监督沟通</td><td>-</td></tr><tr><td>风险(7)</td><td>-</td><td>规划风险<br>识别风险<br>定性分析<br>定量分析<br>规划应对</td><td>实施应对</td><td>监督风险</td><td>-</td></tr><tr><td>采购(3)</td><td>-</td><td>规划采购</td><td>实施采购</td><td>控制采购</td><td>-</td></tr><tr><td>干系人(4)</td><td>识别干系人</td><td>规划参与</td><td>管理参与</td><td>监督参与</td><td>-</td></tr></table><p><span class="key-point">总计：7+6+6+4+3+6+3+7+3+4 = <strong>49个</strong></span></p><h4>记忆技巧</h4><p class="memory-tip">过程组分布口诀："启2规24执10监12尾1" — 整合唯一覆盖全部5组，干系人有启动过程。死记：整合7、范围6、进度6、成本4、质量3、资源6、沟通3、风险7、采购3、干系人4=49。</p><h4>例题</h4><div class="example-q"><p>项目管理的十大知识领域中，唯一有启动和收尾过程组的是()。</p><p>A.范围管理 B.干系人管理 C.风险管理 D.项目整体管理</p><p class="example-ans">答案：D。整体管理有制定章程(启动)和结束项目或阶段(收尾)。干系人管理有识别干系人(启动)但无收尾。</p></div>'},

id:1,title:'案例1：挣值管理综合分析',cat:'成本管理',
scenario:'某信息系统集成项目预算BAC=100万元，项目进行到第6个月末时，项目经理收集到以下数据：计划完成工作预算PV=50万元，实际完成工作价值EV=40万元，实际花费AC=45万元。',
questions:['1. 计算CV、SV、CPI、SPI。','2. 判断当前项目成本和进度状况。','3. 按典型偏差计算EAC和ETC。','4. 计算完工偏差VAC。'],
answer:'<h4>1. 偏差与指数计算</h4>'+
'<p>\u2460 CV = EV - AC = 40 - 45 = <strong>-5万元</strong>（超支）</p>'+
'<p>\u2461 SV = EV - PV = 40 - 50 = <strong>-10万元</strong>（滞后）</p>'+
'<p>\u2462 CPI = EV/AC = 40/45 = <strong>0.89</strong>（&lt;1，超支）</p>'+
'<p>\u2463 SPI = EV/PV = 40/50 = <strong>0.80</strong>（&lt;1，滞后）</p>'+
'<h4>2. 项目状况判断</h4>'+
'<p>CV&lt;0, CPI&lt;1 \u2192 <strong>成本超支</strong></p>'+
'<p>SV&lt;0, SPI&lt;1 \u2192 <strong>进度滞后</strong></p>'+
'<p>综合：项目既超支又滞后，形势严峻。</p>'+
'<h4>3. 完工预测（典型偏差）</h4>'+
'<p>ETC = (BAC - EV)/CPI = (100-40)/0.89 = <strong>67.42万元</strong></p>'+
'<p>EAC = AC + ETC = 45 + 67.42 = <strong>112.42万元</strong></p>'+
'<p>或 EAC = BAC/CPI = 100/0.89 = <strong>112.36万元</strong></p>'+
'<h4>4. 完工偏差</h4>'+
'<p>VAC = BAC - EAC = 100 - 112.36 = <strong>-12.36万元</strong></p>'+
'<p>VAC&lt;0，说明项目最终将超支约12.36万元。</p>'
},

'<li>没有制定有效的沟通管理计划</li></ul>'+

{
id:4,title:'案例4：质量管理与风险',cat:'质量管理',
scenario:'某软件开发项目在系统测试阶段发现大量缺陷，测试团队统计如下：\n\n- 共发现120个缺陷，其中严重缺陷15个、一般缺陷45个、轻微缺陷60个\n- 缺陷来源分析：需求不明确导致30个、设计缺陷40个、编码错误50个\n- 项目已使用了以下质量活动：代码评审、单元测试\n- 项目经理计划在测试完成后直接交付，不再进行其他质量活动',
questions:['1. 用帕累托图思路分析主要缺陷来源。','2. 指出项目经理质量计划的不足。','3. 建议补充哪些质量活动？','4. 说明质量保证(QA)与质量控制(QC)的区别。'],
answer:'<h4>1. 帕累托分析（二八定律）</h4>'+
'<p>按严重程度：严重+一般 = 60个（50%）vs 轻微60个（50%）</p>'+
'<p>按来源：编码错误50个（41.7%）+ 设计缺陷40个（33.3%）+ 需求30个（25%）</p>'+
'<p><strong>结论</strong>：编码错误和设计缺陷占总缺陷75%，应重点关注。</p>'+
'<p>建议优先对编码和设计阶段加强质量活动。</p>'+
'<h4>2. 质量计划不足</h4>'+
'<ul><li>缺少需求评审环节（需求不明确是重要缺陷来源）</li>'+
'<li>缺少设计评审环节</li>'+
'<li>仅做了代码评审和单元测试，质量活动覆盖不全</li>'+
'<li>测试完成后直接交付不合理，缺少验收测试环节</li>'+
'<li>没有使用帕累托图等质量工具进行缺陷分析</li>'+
'<li>缺少过程改进（PDCA中的Act环节）</li></ul>'+
'<h4>3. 补充的质量活动</h4>'+
'<ul><li><strong>需求阶段</strong>：需求评审、需求跟踪矩阵</li>'+
'<li><strong>设计阶段</strong>：设计评审（概要设计评审+详细设计评审）</li>'+
'<li><strong>编码阶段</strong>：编码规范培训、持续代码评审</li>'+
'<li><strong>测试阶段</strong>：集成测试、系统测试、验收测试（完整测试链）</li>'+
'<li><strong>全程</strong>：使用质量工具（鱼骨图分析根本原因、控制图监控过程）</li></ul>'+
'<h4>4. QA vs QC 区别</h4>'+
'<p><strong>质量保证(QA)</strong> — 过程导向</p>'+
'<ul><li>属于执行过程组</li>'+
'<li>侧重过程改进和审计</li>'+
'<li>是预防性的（做对的过程）</li></ul>'+
'<p><strong>质量控制(QC)</strong> — 结果导向</p>'+
'<ul><li>属于监控过程组</li>'+
'<li>侧重检查可交付成果是否合格</li>'+
'<li>是纠正性的（检查产品）</li></ul>'
},
{
id:5,title:'案例5：合同管理与索赔',cat:'采购管理',
scenario:'某政府信息系统项目采用固定总价合同，合同金额800万元，工期10个月。项目执行过程中发生以下事件：\n\n事件1：第3个月，客户要求新增一个功能模块，新增工作量约50万元。项目经理口头答应后直接安排开发，未签订补充协议。\n\n事件2：第5个月，由于客户方内部调整，项目暂停了1个月，造成项目团队人员闲置和资源浪费。\n\n事件3：第7个月，项目团队发现由于供应商提供的中间件存在严重缺陷，导致集成测试反复失败，延误工期15天。供应商拒绝承担任何责任。\n\n事件4：项目最终交付延期20天，客户要求扣罚违约金。',
questions:['1. 分析事件1中项目经理的做法有何不当。','2. 事件2中客户暂停项目，承包商应如何处理？','3. 事件3中的中间件缺陷责任应如何界定？','4. 针对索赔事件，承包商应如何操作？'],
answer:'<h4>1. 事件1分析</h4>'+
'<ul><li>固定总价合同下，新增功能属于范围变更，应走变更控制流程</li>'+
'<li>不应口头答应，应要求客户提交书面变更申请</li>'+
'<li>变更实施前应进行影响分析（成本、进度、质量）</li>'+
'<li>必须签订补充协议或变更令，明确新增费用和工期调整</li>'+
'<li>未经正式变更审批的额外工作，承包商可能无法获得补偿</li></ul>'+
'<h4>2. 事件2处理</h4>'+
'<ul><li>客户暂停属于不可抗力或客户原因，承包商有权索赔</li>'+
'<li><strong>索赔程序</strong>：发出索赔意向通知（28天内）\u2192提交索赔报告和证据\u2192等待批复（28天）\u2192协商/仲裁</li>'+
'<li>索赔内容：人员闲置费、资源占用费、工期顺延</li>'+
'<li>应做好证据留存：暂停通知、人员工时记录、费用清单等</li></ul>'+
'<h4>3. 事件3责任界定</h4>'+
'<ul><li>首先查阅采购合同中关于质量保证和违约责任的条款</li>'+
'<li>如果合同规定了中间件应满足的性能标准，供应商应承担质量责任</li>'+
'<li>承包商应依据合同中的<strong>验收标准</strong>和<strong>质保条款</strong>向供应商提出索赔</li>'+
'<li>索赔内容：中间件更换费用、集成测试延误费用、工期补偿</li>'+
'<li>如供应商拒不配合，可通过合同约定的争议解决机制处理</li></ul>'+
'<h4>4. 承包商索赔操作要点</h4>'+
'<ul><li><strong>及时性</strong>：索赔意向通知应在事件发生后28天内发出</li>'+
'<li><strong>书面性</strong>：所有索赔必须书面形式，保留证据</li>'+
'<li><strong>合理性</strong>：索赔金额和工期要有依据和计算方法</li>'+
'<li><strong>关联性</strong>：索赔事件与损失之间要有因果关系</li>'+
'<li>事件2（客户暂停）和事件3（供应商缺陷）导致的延期，不应由承包商承担</li>'+
'<li>如客户坚持扣罚，承包商可用暂停期间索赔和供应商索赔进行抵扣</li></ul>'
},
{id:6,title:'案例6：变更管理流程分析',cat:'整体管理',
scenario:'某市政府门户网站建设项目，预算800万元，工期12个月。项目进行到第5个月时，建设单位提出增加"在线预约办事"功能模块，预计增加费用120万元，工期延长2个月。项目经理小王收到变更请求后，直接安排开发团队开始实施新功能。3周后测试发现新功能与原有系统存在严重兼容性问题，项目整体进度已经严重滞后。建设单位对此表示不满。',
questions:['1. 指出小王在变更管理中存在的问题。','2. 描述正确的变更管理流程。','3. 变更控制委员会(CCB)的职责是什么？','4. 如何避免类似"范围蔓延"问题？'],
answer:'<h4>1. 存在的问题</h4>'+
'<p>\u2460 <strong>未经评估直接实施</strong>：收到变更请求后未进行影响分析就直接开始开发</p>'+
'<p>\u2461 <strong>未经CCB审批</strong>：变更未提交变更控制委员会审批</p>'+
'<p>\u2462 <strong>未更新项目计划</strong>：未调整范围说明书、进度计划和成本预算</p>'+
'<p>\u2463 <strong>未进行风险分析</strong>：未评估新功能对现有系统的兼容性风险</p>'+
'<p>\u2464 <strong>缺乏配置管理</strong>：新旧系统版本管理混乱</p>'+
'<h4>2. 正确变更流程</h4>'+
'<p>\u2460 提出变更请求 \u2192 \u2461 变更影响分析（范围、进度、成本、质量、风险）</p>'+
'<p>\u2462 CCB审批 \u2192 \u2463 更新项目文件（范围说明书、WBS、进度计划、成本预算）</p>'+
'<p>\u2464 通知相关干系人 \u2192 \u2465 执行变更 \u2192 \u2466 验证变更 \u2192 \u2467 归档</p>'+
'<h4>3. CCB职责</h4>'+
'<p>CCB（变更控制委员会）是负责批准或否决变更请求的正式团体。</p>'+
'<p>主要职责：审查变更请求、评估变更影响、批准/否决变更、协调变更实施。</p>'+
'<p>组成：项目经理、客户代表、关键干系人、技术专家等。</p>'+
'<h4>4. 防止范围蔓延</h4>'+
'<p>\u2460 建立严格的变更控制流程</p>'+
'<p>\u2461 明确项目范围边界（范围说明书+WBS）</p>'+
'<p>\u2462 所有变更必须经过正式审批</p>'+
'<p>\u2463 加强配置管理和版本控制</p>'+
'<p>\u2464 定期进行范围确认</p>'
},
{id:7,title:'案例7：质量管理综合分析',cat:'质量管理',
scenario:'某银行核心系统改造项目，质量要求极高。项目经理建立了质量管理体系，但在项目执行过程中出现问题：模块A功能测试通过率仅65%，缺陷修复后反复出现相同问题；模块B性能测试响应时间超标40%；客户验收时发现多项功能与需求文档不一致。项目组共发现缺陷320个，其中严重缺陷45个。',
questions:['1. 分析项目质量管理各过程是否存在问题。','2. 使用帕累托图(80/20法则)分析缺陷数据。','3. 描述质量审计的过程和目的。','4. 提出质量改进建议。'],
answer:'<h4>1. 质量管理过程问题</h4>'+
'<p>\u2460 <strong>规划质量管理</strong>：可能质量标准不明确，验收标准未与客户确认</p>'+
'<p>\u2461 <strong>质量保证</strong>：过程规范性不足，缺乏质量审计，缺陷反复出现说明根因未消除</p>'+
'<p>\u2462 <strong>质量控制</strong>：测试覆盖不全，性能测试未提前规划，需求跟踪矩阵缺失</p>'+
'<h4>2. 帕累托分析(80/20法则)</h4>'+
'<p>320个缺陷中，假设按模块分布：模块A 130个(40.6%)，模块B 96个(30%)，模块C 54个(16.9%)，其他40个(12.5%)</p>'+
'<p>前两个模块合计226个(70.6%)，<strong>重点关注模块A和B可解决70%以上的缺陷</strong></p>'+
'<p>严重缺陷45个中，假设模块A占20个、模块B占15个，这两个模块占严重缺陷的78%</p>'+
'<h4>3. 质量审计</h4>'+
'<p>质量审计是质量保证过程的重要工具，目的是：</p>'+
'<p>\u2460 识别过程低效和低质量活动</p>'+
'<p>\u2461 确认经过批准的变更请求的实施情况</p>'+
'<p>\u2462 确认可交付成果和工作产品是否符合要求</p>'+
'<p>\u2463 获取过程改进的建议</p>'+
'<p>审计由QA部门或独立审计员执行，结果可用于过程改进计划。</p>'+
'<h4>4. 改进建议</h4>'+
'<p>\u2460 建立完善的需求跟踪矩阵，确保每个需求可追踪到测试用例</p>'+
'<p>\u2461 加强代码审查和单元测试，缺陷修复后必须回归测试</p>'+
'<p>\u2462 制定性能测试计划，提前进行性能基线测试</p>'+
'<p>\u2463 定期进行质量审计，及时发现问题</p>'+
'<p>\u2464 建立缺陷根因分析机制，从根本上解决问题</p>'
},
{id:8,title:'案例8：风险管理综合计算',cat:'风险管理',
scenario:'某企业ERP实施项目面临以下风险事件：\n\n风险A：核心技术人员离职，概率20%，影响损失50万元\n风险B：需求变更频繁，概率60%，影响损失30万元\n风险C：硬件供应商延期交付，概率35%，影响损失25万元\n风险D：数据迁移失败，概率15%，影响损失80万元\n\n项目经理拟定了应对方案：风险A采用减轻策略（培训+文档化）可降低影响至20万元；风险C采用转移策略（合同违约金条款）可降低影响至10万元。',
questions:['1. 计算各风险暴露值(EMV)。','2. 计算项目总风险暴露值。','3. 分析应对方案后的残余风险和次生风险。','4. 建立风险优先级排序。'],
answer:'<h4>1. 各风险EMV计算</h4>'+
'<p>EMV = 概率 \u00d7 影响</p>'+
'<p><strong>风险A</strong>: EMV = 0.20 \u00d7 50 = <strong>10万元</strong></p>'+
'<p><strong>风险B</strong>: EMV = 0.60 \u00d7 30 = <strong>18万元</strong></p>'+
'<p><strong>风险C</strong>: EMV = 0.35 \u00d7 25 = <strong>8.75万元</strong></p>'+
'<p><strong>风险D</strong>: EMV = 0.15 \u00d7 80 = <strong>12万元</strong></p>'+
'<h4>2. 项目总EMV</h4>'+
'<p>总EMV = 10 + 18 + 8.75 + 12 = <strong>48.75万元</strong></p>'+
'<p>建议预留至少48.75万元作为应急储备。</p>'+
'<h4>3. 应对方案分析</h4>'+
'<p><strong>风险A（减轻后）</strong>: EMV = 0.20 \u00d7 20 = 4万元</p>'+
'<p>残余风险EMV: 4万元 | 节省: 10-4=6万元</p>'+
'<p><strong>风险C（转移后）</strong>: EMV = 0.35 \u00d7 10 = 3.5万元</p>'+
'<p>残余风险EMV: 3.5万元 | 节省: 8.75-3.5=5.25万元</p>'+
'<p><strong>次生风险</strong>: 风险C转移后，合同纠纷可能引发法律风险</p>'+
'<p>应对后总EMV: 4+18+3.5+12 = <strong>37.5万元</strong>（节省11.25万元）</p>'+
'<h4>4. 风险优先级排序</h4>'+
'<p>按EMV排序: B(18万)>D(12万)>A(10万)>C(8.75万)</p>'+
'<p>风险B（需求变更频繁）应优先应对，因其EMV最高且概率最大。</p>'
},
{id:9,title:'案例9：采购管理与合同选择',cat:'采购管理',
scenario:'某政府部门的信息化项目需要采购核心交换机设备，预算200万元。市场调研发现：\n\n方案1：品牌A设备，单价180万元，质保3年，到货期15天\n方案2：品牌B设备，单价120万元，质保1年，到货期30天\n方案3：品牌C设备，单价150万元，质保2年，到货期20天\n\n项目要求设备故障后4小时内恢复，质保期不少于2年。经评估，自制vs外购分析显示外购更优。',
questions:['1. 进行自制vs外购分析应考虑哪些因素？','2. 选择合适的合同类型并说明理由。','3. 描述采购管理的关键过程。','4. 如何进行供应商选择？'],
answer:'<h4>1. 自制vs外购分析因素</h4>'+
'<p>\u2460 成本比较（直接成本+间接成本+机会成本）</p>'+
'<p>\u2461 技术能力（是否有足够的技能和知识）</p>'+
'<p>\u2462 时间因素（自制的开发周期 vs 外购的到货周期）</p>'+
'<p>\u2463 战略考虑（核心竞争力、知识产权）</p>'+
'<p>\u2464 风险分析（质量风险、供应风险）</p>'+
'<p>\u2465 法律法规约束（政府采购法要求公开招标）</p>'+
'<h4>2. 方案选择</h4>'+
'<p>方案1（品牌A）<strong>不符合</strong>：超预算200万，虽然质保3年满足要求</p>'+
'<p>方案2（品牌B）<strong>不符合</strong>：质保仅1年，不满足"不少于2年"要求</p>'+
'<p>方案3（品牌C）<strong>最优</strong>：150万在预算内，质保2年满足要求，到货期20天合理</p>'+
'<p>合同类型建议：<strong>固定总价合同(FFP)</strong>，因需求明确、价格固定</p>'+
'<h4>3. 采购管理过程（PMBOK）</h4>'+
'<p>\u2460 规划采购管理 \u2192 \u2461 实施采购 \u2192 \u2462 控制采购 \u2192 \u2463 结束采购</p>'+
'<p>规划阶段：确定采购方式（招标/竞标）、合同类型、评估标准</p>'+
'<p>实施阶段：发布招标公告、接收投标、评标、授标</p>'+
'<p>控制阶段：监督合同执行、管理变更、处理索赔</p>'+
'<h4>4. 供应商选择标准</h4>'+
'<p>\u2460 技术方案（40%）：设备性能指标、兼容性、可扩展性</p>'+
'<p>\u2461 商务报价（30%）：总拥有成本TCO、付款条件</p>'+
'<p>\u2462 资质信誉（15%）：厂商资质、成功案例、财务状况</p>'+
'<p>\u2463 服务支持（15%）：质保期限、响应时间、售后服务</p>'
},
{id:10,title:'案例10：沟通管理与干系人',cat:'沟通管理',
scenario:'某大型信息化项目团队成员20人，分布在3个城市。项目启动3个月后，出现以下问题：\n\n1) 客户反映不知道项目进展\n2) 开发组A不知道需求已经变更\n3) 测试组收到的文档版本与开发不一致\n4) 项目经理每周发邮件汇报，但管理层认为信息不够\n5) 团队成员之间沟通效率低',
questions:['1. 计算项目沟通渠道数量，并说明团队规模扩大后沟通复杂度变化。','2. 分析上述沟通问题的根本原因。','3. 制定有效的沟通管理计划应包含哪些内容？','4. 针对问题提出改进措施。'],
answer:'<h4>1. 沟通渠道计算</h4>'+
'<p>沟通渠道公式: N(N-1)/2，其中N为干系人数量</p>'+

function nav(page){
  currentPage=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const pageEl=$('page-'+page);
  if(pageEl)pageEl.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>{
    if(b.textContent.includes(page==='home'?'首页':page==='knowledge'?'知识':page==='quiz'?'刷题':page==='case'?'案例':page==='calc'?'计算':page==='wrong'?'错题':page==='plan'?'备考':page==='mock'?'模拟':page==='analysis'?'分析':page==='formula'?'公式':''))b.classList.add('active');
  });
  if(page==='home')renderHome();
  else if(page==='knowledge')renderKnowledge();
  else if(page==='quiz')renderQuiz();
  else if(page==='case')renderCase();
  else if(page==='calc')renderCalc();
  else if(page==='wrong')renderWrong();
  else if(page==='plan')renderPlan();
  else if(page==='mock')renderMock();
  else if(page==='analysis')renderAnalysis();
  else if(page==='formula')renderFormulaPage();
}

    '<div class="stat-card"><div class="stat-num" style="color:var(--primary)">'+totalTopics+'</div><div class="stat-label">知识点总数</div></div>'+
    '<div class="stat-card"><div class="stat-num" style="color:var(--success)">'+learnedTopics+'</div><div class="stat-label">已学知识点</div></div>'+

  '</div>'+
  '<div class="card"><div class="card-title">学习进度</div>'+

    '<p style="font-size:.78rem;color:var(--text-s);margin-top:6px">刷题进度 '+answered+'/'+totalQ+'</p>'+
    '<div class="progress-bar" style="margin-top:8px"><div class="fill" style="width:'+(learnedTopics/Math.max(totalTopics,1)*100)+'%;background:var(--success)"></div></div>'+
    '<p style="font-size:.78rem;color:var(--text-s);margin-top:6px">知识点进度 '+learnedTopics+'/'+totalTopics+'</p>'+
  '</div>'+
  '<div class="card"><div class="card-title">快速入口</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:8px">'+
      '<button class="btn-primary" style="padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.84rem" onclick="nav(\'quiz\')">开始刷题</button>'+
      '<button class="btn-success" style="padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.84rem" onclick="nav(\'knowledge\')">复习知识</button>'+
      '<button class="btn-warning" style="padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.84rem" onclick="nav(\'calc\')">打开计算器</button>'+
      '<button class="btn-secondary" style="padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.84rem" onclick="nav(\'wrong\')">复习错题</button>'+
    '</div>'+
  '</div>'+
  '<div class="card"><div class="card-title">数据管理</div>'+
