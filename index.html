      '<button class="btn-secondary" style="padding:8px 16px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:.82rem;background:transparent" onclick="importProgress()">导入进度</button>'+
    '</div>'+
    '<div style="font-size:.73rem;color:var(--text-s);margin-top:6px">导出后可备份到本地，换设备时可导入恢复</div>'+
  '</div>';
}

// ===== KNOWLEDGE =====
let kbViewMode='list';
function renderKnowledge(){
  const db=getDB();
  const learned=db.learnedTopics||[];
  let cats=['all'];
  KB.forEach(c=>cats.push(c.id));

  let html='<input class="search-box" id="kb-search" placeholder="搜索知识点..." oninput="filterKB()">';
  html+='<div class="quiz-config">';
  html+='<select id="kb-cat-filter" onchange="filterKB()">';
  cats.forEach(c=>{html+='<option value="'+c+'">'+(c==='all'?'全部分类':c)+'</option>';});
  html+='</select>';
  html+='<button class="btn-secondary" onclick="collapseAllKB()">全部折叠</button>';
  html+='<button class="btn-secondary" onclick="kbViewMode=\'list\';renderKnowledge()">列表</button>';
  html+='<button class="btn-secondary" onclick="kbViewMode=\'card\';renderKnowledge()">闪卡</button>';
  html+='</div>';
  if(kbViewMode==='card'){
    html+='<div id="kb-list">';
    html+=buildKBCards(learned,'all');
    html+='</div>';
  }else{
    html+='<div id="kb-list">';
    html+=buildKBList(learned,'all','');
    html+='</div>';
  }
  $('page-knowledge').innerHTML=html;
}

let fcIdx=0;
function buildKBCards(learned,filterCat){
  let topics=[];
  KB.forEach((cat,ci)=>{
    if(filterCat!=='all'&&filterCat!==cat.id)return;
    cat.topics.forEach((t,ti)=>{
      const key=cat.id+'_'+ti;
      topics.push({title:t.title,detail:t.detail,cat:cat.id,key,learned:learned.includes(key)});
    });
  });
  if(!topics.length)return '<div style="text-align:center;color:var(--text-s);padding:20px">暂无知识点</div>';
  if(fcIdx>=topics.length)fcIdx=0;
  const t=topics[fcIdx];
  let html='<div class="fc-container">';
  html+='<div style="font-size:.73rem;color:var(--text-s);text-align:center;margin-bottom:6px">'+t.cat+'</div>';
  html+='<div class="fc-card" onclick="this.classList.toggle(\'flipped\')">';
  html+='<div class="fc-card-inner">';
  html+='<div class="fc-card-front">'+t.title+(t.learned?'<small>✓ 已掌握</small>':'<small>点击翻转查看详情</small>')+'</div>';
  html+='<div class="fc-card-back"><div style="width:100%">'+t.detail+'</div>';
  html+='<div style="margin-top:10px;text-align:center;width:100%"><button style="font-size:.75rem;padding:6px 14px;border-radius:8px;border:1px solid var(--primary);cursor:pointer;background:'+(t.learned?'var(--primary)':'transparent')+';color:'+(t.learned?'#fff':'var(--primary)')+'" onclick="event.stopPropagation();markLearned(\''+t.key+'\',this);fcIdx='+fcIdx+';renderKnowledge()">'+(t.learned?'已掌握 ✓':'标记已学')+'</button></div>';
  html+='</div></div></div>';
  html+='<div class="fc-nav">';
  html+='<button onclick="fcIdx=Math.max(0,fcIdx-1);renderKnowledge()"'+(fcIdx===0?' disabled style="opacity:.4"':'')+'>◀</button>';
  html+='<span class="fc-progress">'+(fcIdx+1)+' / '+topics.length+'</span>';
  html+='<button onclick="fcIdx=Math.min('+(topics.length-1)+',fcIdx+1);renderKnowledge()"'+(fcIdx>=topics.length-1?' disabled style="opacity:.4"':'')+'>▶</button>';
  html+='</div>';
  html+='</div>';
  return html;
}

function buildKBList(learned,filterCat,searchTerm){
  let html='';
  KB.forEach((cat,ci)=>{
    if(filterCat!=='all'&&filterCat!==cat.id)return;
    let filteredTopics=cat.topics;
    if(searchTerm){
      filteredTopics=cat.topics.filter(t=>t.title.includes(searchTerm)||t.detail.includes(searchTerm));
    }
    if(searchTerm&&filteredTopics.length===0)return;
    html+='<div class="knowledge-category" id="kb-cat-'+ci+'">';
    html+='<div class="cat-header" onclick="toggleKB('+ci+')">';
    html+='<h3>'+cat.title+' <span class="tag tag-blue">'+filteredTopics.length+'</span></h3>';
    html+='<span class="arrow">\u25b6</span></div>';
    html+='<div class="cat-body">';
    filteredTopics.forEach((t,ti)=>{
      const key=cat.id+'_'+ti;
      const isLearned=learned.includes(key);
      html+='<div class="topic-item'+(isLearned?' learned':'')+'">';
      html+='<div class="topic-title"><span onclick="toggleTopic(this)">'+t.title+'</span>';
      html+='<button class="mark-btn'+(isLearned?' marked':'')+'" onclick="event.stopPropagation();markLearned(\''+key+'\',this)">'+(isLearned?'已掌握':'标记已学')+'</button>';
      html+='</div>';
      html+='<div class="topic-detail">'+t.detail+'</div>';
      html+='</div>';
    });
    html+='</div></div>';
  });
  return html;
}

function toggleKB(ci){
  const el=document.getElementById('kb-cat-'+ci);
  el.classList.toggle('open');
}

function collapseAllKB(){
  document.querySelectorAll('.knowledge-category').forEach(el=>el.classList.remove('open'));
}

function filterKB(){
  const db=getDB();
  const learned=db.learnedTopics||[];
  const filterCat=$('kb-cat-filter').value;
  const searchTerm=$('kb-search').value.trim();
  $('kb-list').innerHTML=buildKBList(learned,filterCat,searchTerm);
}

function toggleTopic(el){
  const detail=el.parentElement.nextElementSibling;
  detail.style.display=detail.style.display==='block'?'none':'block';
}

function markLearned(key,btn){
  const db=getDB();
  if(!db.learnedTopics)db.learnedTopics=[];
  const idx=db.learnedTopics.indexOf(key);
  if(idx>=0){
    db.learnedTopics.splice(idx,1);
    btn.textContent='标记已学';
    btn.classList.remove('marked');
    btn.parentElement.parentElement.classList.remove('learned');
    toast('已取消标记');
  }else{
    db.learnedTopics.push(key);
    btn.textContent='已掌握';
    btn.classList.add('marked');
    btn.parentElement.parentElement.classList.add('learned');
    toast('已标记为已学');
  }
  saveDB(db);
}

// ===== QUIZ =====
function getFilteredQuestions(){
  let qs=quizState.cat==='all'?[...QB]:QB.filter(q=>q.cat===quizState.cat);
  if(quizState.random){
    if(!quizState._shuffled){
      for(let i=qs.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [qs[i],qs[j]]=[qs[j],qs[i]];
      }
      quizState._shuffled=qs;
    }
    return quizState._shuffled;
  }
  return qs;
}

function renderQuiz(){
  // 恢复保存的刷题进度
  const savedProgress=getDB().quizState;
  if(savedProgress){
    if(savedProgress.mode)quizState.mode=savedProgress.mode;
    if(savedProgress.cat)quizState.cat=savedProgress.cat;
    if(savedProgress.random!==undefined)quizState.random=savedProgress.random;
    if(savedProgress.timed!==undefined)quizState.timed=savedProgress.timed;
  }
  const cats=['all'];
  QB.forEach(q=>{if(!cats.includes(q.cat))cats.push(q.cat);});

  let html='<div class="card"><div class="card-title">刷题配置</div>';
  html+='<div class="quiz-config">';
  html+='<select id="quiz-mode" onchange="quizState.mode=this.value;startQuiz()">';
  html+='<option value="practice"'+(quizState.mode==='practice'?' selected':'')+'>练习模式</option>';
  html+='<option value="exam"'+(quizState.mode==='exam'?' selected':'')+'>考试模式</option>';
  html+='</select>';
  html+='<select id="quiz-cat" onchange="quizState.cat=this.value;startQuiz()">';
  cats.forEach(c=>{html+='<option value="'+c+'"'+(quizState.cat===c?' selected':'')+'>'+(c==='all'?'全部分类':c)+'</option>';});
  html+='</select>';
  html+='<button class="btn-primary" style="padding:8px 12px;border-radius:8px;font-size:.82rem;border:none;cursor:pointer" onclick="startQuiz()">重新开始</button>';
  html+='<label style="display:flex;align-items:center;gap:4px;font-size:.82rem;cursor:pointer;white-space:nowrap"><input type="checkbox" id="quiz-random" '+(quizState.random?'checked':'')+' onchange="quizState.random=this.checked;startQuiz()"> 随机</label>';
  html+='<label style="display:flex;align-items:center;gap:4px;font-size:.82rem;cursor:pointer;white-space:nowrap"><input type="checkbox" id="quiz-timed" '+(quizState.timed?'checked':'')+' onchange="quizState.timed=this.checked;startQuiz()"> 限时(2分钟/题)</label>';
  // 在 quiz-config card 的 </div> 前添加进度
  const answeredCount=Object.keys(quizState.answered).length;
  const correctCount=Object.values(quizState.answered).filter(v=>v===true).length;
  const totalQ=quizState.cat==='all'?QB.length:QB.filter(q=>q.cat===quizState.cat).length;
  if(answeredCount>0){
    html+='<div style="margin-top:8px;font-size:.78rem;color:var(--text-s)">进度: '+answeredCount+'/'+totalQ+' | 正确: '+correctCount+'/'+answeredCount+'</div>';
  }
  html+='</div></div>';
  html+='<div id="quiz-area"></div>';
  $('page-quiz').innerHTML=html;
  // 有保存进度且模式/分类匹配时恢复
  if(savedProgress&&savedProgress.answers&&Object.keys(savedProgress.answers).length>0
    &&savedProgress.mode===quizState.mode&&savedProgress.cat===quizState.cat&&!quizState.done){
    quizState.idx=savedProgress.idx||0;
    quizState.answers=savedProgress.answers||{};
    quizState.answered=savedProgress.answered||{};
    if(savedProgress.shuffled)quizState._shuffled=savedProgress.shuffled;
    renderQuizQuestion();
  }else if(!quizState.done){
    startQuiz();
  }else{
    renderQuizQuestion();
  }
}

function startQuiz(){
  if(quizState.timer){clearInterval(quizState.timer);quizState.timer=null;}
  quizState.idx=0;
  quizState.answers={};
  quizState.answered={};
  quizState.seconds=0;
  quizState.started=false;
  quizState.done=false;
  quizState._shuffled=null;
  quizState.questionStart=Date.now();
  quizState.times={};
  if(quizState.mode==='exam')quizState.seconds=QB.length*60;
  // 清除保存的进度
  const db=getDB();delete db.quizState;saveDB(db);
  saveQuizProgress();
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const qs=getFilteredQuestions();
  if(qs.length===0){$('quiz-area').innerHTML='<div class="card"><p>该分类暂无题目</p></div>';return;}
  if(quizState.idx>=qs.length){
    quizState.done=true;
    if(quizState.timer){clearInterval(quizState.timer);quizState.timer=null;}
    renderQuizResult();
    return;
  }
  const q=qs[quizState.idx];
  const answered=quizState.answered[quizState.idx];
  const selected=quizState.answers[quizState.idx];
  const labels=['A','B','C','D'];

  let html='';
  if(quizState.mode==='exam'){
    html+='<div class="timer-display">'+formatTime(quizState.seconds)+'</div>';
    html+='<div class="timer-controls">';
    if(!quizState.started){
      html+='<button class="btn-primary" onclick="startTimer()">开始计时</button>';
    }else{
      html+='<button class="btn-warning" onclick="pauseTimer()">暂停</button>';
    }
    html+='</div>';
  }
  html+='<div class="quiz-progress">';
  for(let i=0;i<qs.length;i++){
    let cls='quiz-dot';
    if(i===quizState.idx)cls+=' current';
    if(quizState.answered[i]===true)cls+=' correct';
    if(quizState.answered[i]===false)cls+=' wrong';
    html+='<span class="'+cls+'" onclick="jumpToQ('+i+')"></span>';
  }
  html+='</div>';
  html+='<div class="card">';
  html+='<div class="card-title"><span class="tag tag-blue">'+q.cat+'</span>';
  const freq=q.freq||'?'; const freqColor={'高':'tag-red','中':'tag-yellow','低':'tag-green','?':'tag-purple'};
  html+='<span class="tag '+(freqColor[freq]||'tag-purple')+'" title="考试频率">考频:'+freq+'</span>';
  const diff=q.diff||'?'; const diffLabel={1:'易',2:'中',3:'难','?':'?'};
  const diffColor={1:'tag-green',2:'tag-yellow',3:'tag-red','?':'tag-purple'};
  html+='<span class="tag '+(diffColor[diff]||'tag-purple')+'" title="难度等级">难度:'+(diffLabel[diff]||'?')+'</span>';
  html+=' 第'+(quizState.idx+1)+'/'+qs.length+'题</div>';
  if(quizState.timed&&!answered){
    const elapsed=Math.round((Date.now()-quizState.questionStart)/1000);
    const over120=elapsed>120;
    html+='<div style="font-size:.78rem;margin-bottom:8px;padding:4px 8px;border-radius:4px;'+(over120?'background:#fef2f2;color:var(--danger);font-weight:600':'color:var(--text-s)')+'" id="quiz-timer-display">已用时间：'+elapsed+'秒'+(over120?' \u26a0 \u5df2\u8d85\u8fc7\u5efa\u8bae\u7b54\u9898\u65f6\u95f4':'')+'</div>';
  }
  html+='<p style="font-size:.9rem;margin-bottom:10px">'+q.q+'</p>';
  html+='<div class="quiz-options">';
  q.opts.forEach((opt,oi)=>{
    let cls='quiz-option';
    if(!answered&&selected===oi)cls+=' selected';
    if(answered){
      if(oi===q.ans)cls+=' correct';
      else if(selected===oi&&oi!==q.ans)cls+=' wrong';
    }
    html+='<div class="'+cls+'" onclick="selectQuizOption('+oi+')">';
    html+='<span class="opt-label">'+labels[oi]+'</span>'+opt;
    html+='</div>';
  });
  html+='</div>';
  if(answered){
    const isCorrect=selected===q.ans;
    html+='<div class="quiz-explanation'+(isCorrect?'':' wrong-exp')+' show">';
    html+='<strong>'+(isCorrect?'\u2714 正确':'\u2718 错误，正确答案：'+labels[q.ans])+'</strong>';
    html+='<p style="margin-top:4px">'+q.exp+'</p>';
    html+='</div>';
  }
  html+='</div>';
  if(quizState.mode==='practice'&&selected!==undefined&&answered===undefined){
    html+='<div style="margin-top:10px;display:flex;gap:8px">';
    html+='<button class="btn-success" style="padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.84rem" onclick="confirmAnswer()">确认答案</button>';
    html+='</div>';
  }
  html+='</div>';
  html+='<div class="quiz-nav">';
  if(quizState.idx>0)html+='<button class="btn-secondary" onclick="prevQ()">上一题</button>';
  if(quizState.idx<qs.length-1)html+='<button class="btn-primary" onclick="nextQ()">下一题</button>';
  if(quizState.idx===qs.length-1&&quizState.answered[quizState.idx]!==undefined)html+='<button class="btn-success" onclick="finishQuiz()">查看结果</button>';
  html+='</div>';
  $('quiz-area').innerHTML=html;
}

function selectQuizOption(oi){
  const qs=getFilteredQuestions();
  const q=qs[quizState.idx];
  // 如果已经确认过答案（查看了解析），不允许更改
  if(quizState.answered[quizState.idx]!==undefined)return;
  // 练习模式：先记录选择，但不立即判断
  if(quizState.mode==='practice'){
    quizState.answers[quizState.idx]=oi;
    saveQuizProgress();
    renderQuizQuestion();
    return;
  }
  // 考试模式：选择即确认
  quizState.answers[quizState.idx]=oi;
  quizState.answered[quizState.idx]=oi===q.ans;
  const db=getDB();
  if(!db.quizAnswered)db.quizAnswered={};
  const qKey=q.q.slice(0,20);
  db.quizAnswered[qKey]=quizState.answered[quizState.idx];
  saveDB(db);
  if(!quizState.answered[quizState.idx]){
    if(!db.wrongBook)db.wrongBook={};
    db.wrongBook[qKey]={q:q.q,opts:q.opts,ans:q.ans,cat:q.cat,exp:q.exp,freq:q.freq,diff:q.diff,date:Date.now()};
    saveDB(db);
  }else{
    if(!db.wrongBook)db.wrongBook={};
    delete db.wrongBook[qKey];
    saveDB(db);
  }
  renderQuizQuestion();
}

function confirmAnswer(){
  const qs=getFilteredQuestions();
  const q=qs[quizState.idx];
  const oi=quizState.answers[quizState.idx];
  if(oi===undefined)return;
  if(quizState.timed){quizState.times[quizState.idx]=Math.round((Date.now()-quizState.questionStart)/1000);}
  quizState.answered[quizState.idx]=oi===q.ans;
  const db=getDB();
  if(!db.quizAnswered)db.quizAnswered={};
  const qKey=q.q.slice(0,20);
  db.quizAnswered[qKey]=quizState.answered[quizState.idx];
  if(!db.wrongBook)db.wrongBook={};
  if(!quizState.answered[quizState.idx]){
    db.wrongBook[qKey]={q:q.q,opts:q.opts,ans:q.ans,cat:q.cat,exp:q.exp,freq:q.freq,diff:q.diff,date:Date.now()};
  }else{
    delete db.wrongBook[qKey];
  }
  saveDB(db);
  saveQuizProgress();
  renderQuizQuestion();
}

function saveQuizProgress(){
  const db=getDB();
  db.quizState={
    mode:quizState.mode,
    cat:quizState.cat,
    idx:quizState.idx,
    answers:quizState.answers,
    answered:quizState.answered,
    random:quizState.random||false,
    timed:quizState.timed||false
  };
  saveDB(db);
}

function prevQ(){if(quizState.idx>0){quizState.idx--;saveQuizProgress();renderQuizQuestion();}}
function nextQ(){if(quizState.idx<getFilteredQuestions().length-1){quizState.idx++;saveQuizProgress();renderQuizQuestion();}}
function jumpToQ(i){quizState.idx=i;renderQuizQuestion();}

function startTimer(){
  quizState.started=true;
  quizState.timer=setInterval(()=>{
    quizState.seconds--;
    const td=$('quiz-area')?.querySelector('.timer-display');
    if(td)td.textContent=formatTime(quizState.seconds);
    if(quizState.seconds<=0){
      clearInterval(quizState.timer);
      toast('时间到！自动提交');
      finishQuiz();
    }
  },1000);
  renderQuizQuestion();
}

function pauseTimer(){
  if(quizState.timer){clearInterval(quizState.timer);quizState.timer=null;quizState.started=false;}
  renderQuizQuestion();
}

function formatTime(s){
  const m=Math.floor(s/60);
  const sec=s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function finishQuiz(){
  quizState.done=true;
  if(quizState.timer){clearInterval(quizState.timer);quizState.timer=null;}
  renderQuizResult();
}

function renderQuizResult(){
  const qs=getFilteredQuestions();
  let correct=0,wrong=0,unanswered=0;
  qs.forEach((q,i)=>{
    if(quizState.answered[i]===true)correct++;
    else if(quizState.answered[i]===false)wrong++;
    else unanswered++;
  });
  const total=qs.length;
  const pct=total?Math.round(correct/total*100):0;

  let html='<div class="card" style="text-align:center">';
  html+='<h3 style="margin-bottom:14px">考试结果</h3>';
  html+='<div class="stats-row">';
  html+='<div class="stat-card"><div class="stat-num" style="color:var(--success)">'+correct+'</div><div class="stat-label">正确</div></div>';
  html+='<div class="stat-card"><div class="stat-num" style="color:var(--danger)">'+wrong+'</div><div class="stat-label">错误</div></div>';

  let html='<div class="card"><div class="card-title">挣值管理计算器</div>';
  html+='<div class="calc-form">';
  html+='<div><label>BAC (预算总额)</label><input type="number" id="evm-bac" value="100"></div>';
  html+='<div><label>PV (计划值)</label><input type="number" id="evm-pv" value="50"></div>';
  html+='<div><label>EV (挣值)</label><input type="number" id="evm-ev" value="40"></div>';
  html+='<div><label>AC (实际成本)</label><input type="number" id="evm-ac" value="45"></div>';
  html+='</div>';
  html+='<div style="margin-top:10px"><button class="btn-primary" style="padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.84rem" onclick="calcEVM()">计算</button></div>';
  html+='<div id="evm-result"></div></div>';
  $('calc-content').innerHTML=html;

function calcEVM(){
  const BAC=parseFloat($('evm-bac').value)||0;
  const PV=parseFloat($('evm-pv').value)||0;
  const EV=parseFloat($('evm-ev').value)||0;
  const AC=parseFloat($('evm-ac').value)||0;

  const CV=EV-AC;
  const SV=EV-PV;
  const CPI=AC?EV/AC:0;
  const SPI=PV?EV/PV:0;

  const etcNonTypical=BAC-EV;
  const etcTypical=CPI?((BAC-EV)/CPI):0;
  const eacNonTypical=AC+etcNonTypical;
  const eacTypical=AC+etcTypical;
  const VAC=BAC-eacTypical;
  const TCPI=(BAC-AC)?((BAC-EV)/(BAC-AC)):0;

  const cls={good:'good',bad:'bad',warn:'warn'};
  let html='<div class="calc-result">';
  html+=resultItem('CV (成本偏差)',CV.toFixed(2)+'万',CV>=0?cls.good:cls.bad);
  html+=resultItem('SV (进度偏差)',SV.toFixed(2)+'万',SV>=0?cls.good:cls.bad);
  html+=resultItem('CPI (成本绩效指数)',CPI.toFixed(4),CPI>=1?cls.good:cls.bad);
  html+=resultItem('SPI (进度绩效指数)',SPI.toFixed(4),SPI>=1?cls.good:cls.bad);
  html+='</div>';
  html+='<div class="calc-result">';
  html+='<p style="font-size:.78rem;color:var(--text-s);margin-bottom:6px;font-weight:600">完工预测</p>';
  html+=resultItem('ETC (典型)',etcTypical.toFixed(2)+'万');
  html+=resultItem('ETC (非典型)',etcNonTypical.toFixed(2)+'万');
  html+=resultItem('EAC (典型)',eacTypical.toFixed(2)+'万',eacTypical<=BAC?cls.good:cls.bad);
  html+=resultItem('EAC (非典型)',eacNonTypical.toFixed(2)+'万',eacNonTypical<=BAC?cls.good:cls.bad);
  html+=resultItem('VAC (完工偏差)',VAC.toFixed(2)+'万',VAC>=0?cls.good:cls.bad);
  html+=resultItem('TCPI (完工绩效指数)',TCPI.toFixed(4));
  html+='</div>';
  html+='<div class="formula-ref"><h4>判断</h4><p>'+
    (CV>=0?'CV\u22650 成本节约':'CV&lt;0 成本超支')+' | '+
    (SV>=0?'SV\u22650 进度超前':'SV&lt;0 进度滞后')+' | '+
    (CPI>=1?'CPI\u22651 成本节约':'CPI&lt;1 成本超支')+' | '+
    (SPI>=1?'SPI\u22651 进度超前':'SPI&lt;1 进度滞后')+
  '</p></div>';
  $('evm-result').innerHTML=html;
}

function addCPMActivity(){
  const name=$('cpm-name').value.trim();
  const dur=parseInt($('cpm-dur').value);
  const preStr=$('cpm-pre').value.trim();
  if(!name||!dur||isNaN(dur)){toast('请填写完整信息');return;}
  const pre=preStr?preStr.split(',').map(s=>s.trim()).filter(Boolean):[];
  cpmActivities.push({name,dur,pre});
  $('cpm-name').value='';$('cpm-dur').value='';$('cpm-pre').value='';

  toast('已添加活动 '+name);

function resetCPM(){

function calcCPM(){
  if(cpmActivities.length===0){
    $('cpm-result').innerHTML='<p style="font-size:.82rem;color:var(--text-s)">请添加活动</p>';
    return;
  }
  const acts={};
  cpmActivities.forEach(a=>{acts[a.name]={name:a.name,dur:a.dur,pre:a.pre,es:0,ef:0,ls:0,lf:0,tf:0,ff:0};});

  // Topological sort for forward pass
  const sorted=[];
  const visited=new Set();
  function visit(name){
    if(visited.has(name))return;
    visited.add(name);
    (acts[name].pre||[]).forEach(p=>{if(acts[p])visit(p);});
    sorted.push(name);
  }
  Object.keys(acts).forEach(n=>visit(n));

  // Forward pass
  sorted.forEach(name=>{
    const a=acts[name];
    a.es=(a.pre||[]).reduce((max,p)=>{return acts[p]?Math.max(max,acts[p].ef):max;},0);
    a.ef=a.es+a.dur;
  });

  const projectDur=sorted.reduce((max,n)=>Math.max(max,acts[n].ef),0);

  // Backward pass
  const reversed=[...sorted].reverse();
  reversed.forEach(name=>{
    const a=acts[name];
    const successors=sorted.filter(n=>(acts[n].pre||[]).includes(name));
    if(successors.length===0){
      a.lf=projectDur;
    }else{
      a.lf=successors.reduce((min,s)=>Math.min(min,acts[s].ls),Infinity);
    }
    a.ls=a.lf-a.dur;
  });

  // Float
  sorted.forEach(name=>{
    const a=acts[name];
    a.tf=a.ls-a.es;
    const successors=sorted.filter(n=>(acts[n].pre||[]).includes(name));
    if(successors.length===0){
      a.ff=projectDur-a.ef;
    }else{
      a.ff=successors.reduce((min,s)=>Math.min(min,acts[s].es),Infinity)-a.ef;
    }
  });

  // Critical path
  const critical=sorted.filter(n=>acts[n].tf===0);
  const cpStr=critical.join(' \u2192 ');

  let html='<div class="cpm-network">';
  html+='<table class="process-table" style="font-size:.76rem">';
  html+='<tr><th>活动</th><th>工期</th><th>ES</th><th>EF</th><th>LS</th><th>LF</th><th>TF</th><th>FF</th><th>关键</th></tr>';
  sorted.forEach(name=>{
    const a=acts[name];
    const isCritical=a.tf===0;
    html+='<tr><td style="font-weight:600">'+a.name+'</td><td>'+a.dur+'</td>';
    html+='<td>'+a.es+'</td><td>'+a.ef+'</td><td>'+a.ls+'</td><td>'+a.lf+'</td>';
    html+='<td style="color:'+(isCritical?'var(--danger)':'var(--text)')+'">'+a.tf+'</td>';
    html+='<td>'+a.ff+'</td>';
    html+='<td>'+(isCritical?'\u2605':'')+'</td></tr>';
  });
  html+='</table>';
  html+='<div style="margin-top:10px;padding:10px;background:#eff6ff;border-radius:8px;font-size:.84rem">';
  html+='<strong>项目总工期：'+projectDur+'</strong><br>';
  html+='<strong>关键路径：'+cpStr+'</strong>';
  html+='</div></div>';
  $('cpm-result').innerHTML=html;
}

function renderPERT(){
  let html='<div class="card"><div class="card-title">三点估算(PERT)计算器</div>';
  html+='<div class="calc-form">';
  html+='<div><label>乐观时间 O</label><input type="number" id="pert-o" value="6"></div>';
  html+='<div><label>最可能时间 M</label><input type="number" id="pert-m" value="10"></div>';
  html+='<div><label>悲观时间 P</label><input type="number" id="pert-p" value="20"></div>';
  html+='</div>';
  html+='<div style="margin-top:10px"><button class="btn-primary" style="padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-size:.84rem" onclick="calcPERT()">计算</button></div>';
  html+='<div id="pert-result"></div></div>';
  $('calc-content').innerHTML=html;
}

function calcPERT(){
  const O=parseFloat($('pert-o').value)||0;
  const M=parseFloat($('pert-m').value)||0;
  const P=parseFloat($('pert-p').value)||0;
  const tE=(O+4*M+P)/6;
  const sigma=(P-O)/6;

  let html='<div class="calc-result">';
  html+=resultItem('期望工期 tE',tE.toFixed(2));
  html+=resultItem('标准差 \u03c3',sigma.toFixed(2));
  html+='</div>';
  html+='<div class="calc-result">';
  html+='<p style="font-size:.78rem;color:var(--text-s);margin-bottom:6px;font-weight:600">概率区间</p>';
  html+=resultItem('\u00b11\u03c3 范围',(tE-sigma).toFixed(2)+' ~ '+(tE+sigma).toFixed(2),'');
  html+=resultItem('\u00b11\u03c3 概率','68.27%');
  html+=resultItem('\u00b12\u03c3 范围',(tE-2*sigma).toFixed(2)+' ~ '+(tE+2*sigma).toFixed(2),'');
  html+=resultItem('\u00b12\u03c3 概率','95.45%');
  html+=resultItem('\u00b13\u03c3 范围',(tE-3*sigma).toFixed(2)+' ~ '+(tE+3*sigma).toFixed(2),'');
  html+=resultItem('\u00b13\u03c3 概率','99.73%');
  html+='</div>';
  html+='<div class="formula-ref"><h4>公式</h4><p>tE = (O + 4M + P) / 6<br>\u03c3 = (P - O) / 6</p></div>';
  $('pert-result').innerHTML=html;
}

function renderFormulaRef(){
  let html='<div class="card"><div class="card-title">核心公式速查</div>';
  html+='<div class="formula-ref" style="background:#fff;border:1px solid var(--border)">';
  html+='<h4 style="color:var(--primary-dark);margin-bottom:8px">挣值管理</h4>';
  html+='<p>CV = EV - AC（成本偏差，正=节约）<br>';
  html+='SV = EV - PV（进度偏差，正=超前）<br>';
  html+='CPI = EV / AC（成本指数，&gt;1节约）<br>';
  html+='SPI = EV / PV（进度指数，&gt;1超前）<br>';
  html+='EAC(典型) = BAC / CPI<br>';
  html+='EAC(非典型) = AC + BAC - EV<br>';
  html+='ETC(典型) = (BAC - EV) / CPI<br>';
  html+='ETC(非典型) = BAC - EV<br>';
  html+='VAC = BAC - EAC<br>';
  html+='TCPI = (BAC - EV) / (BAC - AC)</p>';
  html+='<h4 style="color:var(--primary-dark);margin:10px 0 8px">关键路径法</h4>';
  html+='<p>ES = max(前置EF)<br>';
  html+='EF = ES + Dur<br>';
  html+='LF = min(后置LS)<br>';
  html+='LS = LF - Dur<br>';
  html+='TF(总浮动) = LS - ES = LF - EF<br>';
  html+='FF(自由浮动) = ES(后置) - EF(当前)<br>';
  html+='关键路径 = TF=0的活动路径</p>';
  html+='<h4 style="color:var(--primary-dark);margin:10px 0 8px">三点估算(PERT)</h4>';
  html+='<p>tE = (O + 4M + P) / 6<br>';
  html+='\u03c3 = (P - O) / 6</p>';
  html+='<h4 style="color:var(--primary-dark);margin:10px 0 8px">沟通管理</h4>';
  html+='<p>沟通渠道 = n(n-1)/2</p>';
  html+='<h4 style="color:var(--primary-dark);margin:10px 0 8px">风险管理</h4>';
  html+='<p>EMV = 影响 \u00d7 概率</p>';
  html+='</div></div>';
  $('calc-content').innerHTML=html;
}

    html+='<button class="btn-warning" style="padding:4px 10px;border:none;border-radius:4px;font-size:.73rem;cursor:pointer" onclick="retryWrong(\''+k+'\')">重做</button>';
    html+='</div>';
    html+='</div>';
  });
  if(keys.length===0){
    html+='<div class="card" style="text-align:center"><p style="color:var(--text-s)">该分类暂无错题</p></div>';
  }
  $('wrong-list').innerHTML=html;
}

function removeWrong(key){
  const db=getDB();
  if(!db.wrongBook)db.wrongBook={};
  delete db.wrongBook[key];
  saveDB(db);
  filterWrong();
  toast('已从错题本移除');
}

function retryWrong(key){
  const db=getDB();
  const w=(db.wrongBook||{})[key];
  if(!w)return;
  const labels=['A','B','C','D'];
  const ans=prompt('请选择正确答案（输入A/B/C/D）：\n\n'+w.q+'\n\nA. '+w.opts[0]+'\nB. '+w.opts[1]+'\nC. '+w.opts[2]+'\nD. '+w.opts[3]);
  if(ans===null)return;
  const ansIdx=labels.indexOf(ans.toUpperCase());
  if(ansIdx===w.ans){
    delete db.wrongBook[key];
    saveDB(db);
    toast('回答正确！已从错题本移除');
    filterWrong();
  }else{
    toast('回答错误，正确答案是 '+labels[w.ans]);
  }
}

function clearWrong(){
  if(!confirm('确定清空所有错题？'))return;
  const db=getDB();
  db.wrongBook={};
  saveDB(db);
  renderWrong();
  toast('错题本已清空');
}

function doCheckIn(){
  const db=getDB();
  const today=new Date().toISOString().slice(0,10);
  const lastCheckIn=db.lastCheckIn||'';

  if(lastCheckIn===today){toast('今日已打卡');return;}

  // Calculate streak
  const yesterday=new Date();
  yesterday.setDate(yesterday.getDate()-1);
  const yesterdayStr=yesterday.toISOString().slice(0,10);

  if(lastCheckIn===yesterdayStr){
    db.checkInStreak=(db.checkInStreak||0)+1;
  }else{
    db.checkInStreak=1;
  }
  db.lastCheckIn=today;
  saveDB(db);
  toast('打卡成功！连续'+db.checkInStreak+'天');
  renderPlan();
}

function toggleTask(key,checked){
  const db=getDB();
  if(!db.checkedTasks)db.checkedTasks={};
  if(checked){
    db.checkedTasks[key]=new Date().toISOString().slice(0,10);
  }else{
    delete db.checkedTasks[key];
  }
  saveDB(db);
  renderPlan();
}

function getMockQuestions(){
  const paper=mockState.paper;
  let questions=[];
  paper.sections.forEach(sec=>{
    if(sec.type==='choice'){
      let pool=QB.filter(q=>!sec.catFilter||q.cat===sec.catFilter);
      // Shuffle and pick
      pool=shuffleArray([...pool]);
      const selected=pool.slice(0,sec.count);
      selected.forEach(q=>{questions.push({...q,sectionIdx:questions.length,_type:'choice'})});
    } else if(sec.type==='case'){
      CASES.slice(0,sec.count).forEach((c,i)=>{questions.push({...c,_type:'case',sectionIdx:questions.length,caseIdx:i})});
    }
  });
  return questions;
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function renderMockResult(){
  const el=$('page-mock');
  let correctCount=0;
  let wrongCount=0;
  let unanswered=0;
  const catStats={};

  mockQuestions.forEach((q,i)=>{
    if(q._type!=='choice')return;
    const ans=mockState.answers[i];
    if(ans===undefined){unanswered++;}
    else if(ans===q.ans){correctCount++;catStats[q.cat]=(catStats[q.cat]||{correct:0,wrong:0});catStats[q.cat].correct++;}
    else{wrongCount++;catStats[q.cat]=(catStats[q.cat]||{correct:0,wrong:0});catStats[q.cat].wrong++;}
  });

  const totalChoice=mockQuestions.filter(q=>q._type==='choice').length;
  const score=Math.round(correctCount/totalChoice*75);
  const passLine=45;
  const passed=score>=passLine;
  const m=Math.floor(mockState.totalTime/60);
  const s=mockState.totalTime%60;

  let html='<div class="card mock-result"><h2 style="margin-bottom:8px">模拟考卷成绩</h2>';
  html+='<div class="score '+(passed?'pass':'fail')+'">'+score+'</div>';

  // Category analysis
  html+='<div class="card"><div class="card-title">各章节正确率</div>';
  const cats=Object.entries(catStats);
  cats.sort((a,b)=>{
    const ra=a[1].correct/(a[1].correct+a[1].wrong||1);
    const rb=b[1].correct/(b[1].correct+b[1].wrong||1);
    return ra-rb;
  });
  cats.forEach(([cat,stats])=>{
    const total=stats.correct+stats.wrong;
    const rate=Math.round(stats.correct/total*100);
    const color=rate>=70?'var(--success)':rate>=50?'var(--warning)':'var(--danger)';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:.84rem">';

  });
  html+='</div>';

  // Weak suggestions
  const weakCats=cats.filter(([c,s])=>{
    const r=s.correct/(s.correct+s.wrong||1);
    return r<0.6&&s.wrong>2;
  });
  if(weakCats.length>0){
    html+='<div class="card"><div class="card-title" style="color:var(--danger)">薄弱环节建议</div>';

      html+='<p style="font-size:.84rem;margin:6px 0">\u2022 <strong>'+cat+'</strong>：正确率较低，建议重点复习该章节知识点并刷题</p>';
    });
    html+='</div>';

  // Question review
  html+='<div class="card"><div class="card-title">答题回顾</div>';

    if(q._type!=='choice')return;

    if(!isCorrect&&!isUnanswered)html+='<div class="mock-review-answer" style="color:var(--text-s);margin-top:4px">解析：'+q.exp+'</div>';
    html+='</div>';
  });
  html+='</div>';

  // Case study reference answers
  const caseQuestions=mockQuestions.filter(q=>q._type==='case');
  if(caseQuestions.length>0){
    html+='<div class="card"><div class="card-title">案例分析参考答案</div>';
    caseQuestions.forEach((q,idx)=>{
      html+='<div class="case-reference"><h4>案例'+(idx+1)+'</h4><p>'+q.answer+'</p></div>';
    });
    html+='</div>';
  }

  html+='<div style="text-align:center;margin:14px 0"><button class="btn-primary" onclick="mockState={mode:\'config\',paper:{},currentQ:0,answers:{},timeLeft:0,timer:null,startTime:null};mockQuestions=[];nav(\'mock\')">返回试卷选择</button></div>';
  el.innerHTML=html;

function renderFormulaPage(){
  let html='<input class="search-box" id="formula-search" placeholder="搜索公式名称、公式内容..." oninput="filterFormulas()" style="margin-bottom:10px">';
  html+='<div id="formula-list"></div>';
  $('page-formula').innerHTML=html;
  filterFormulas();
}

function filterFormulas(){
  const term=($('formula-search')?.value||'').toLowerCase();
  const grouped={};
  FORMULAS.forEach(f=>{
    if(term&&!f.name.toLowerCase().includes(term)&&!f.formula.toLowerCase().includes(term)&&!f.cat.includes(term)&&!f.desc.includes(term))return;
    if(!grouped[f.cat])grouped[f.cat]=[];
    grouped[f.cat].push(f);
  });
  let html='';
  Object.entries(grouped).forEach(([cat,list])=>{
    html+='<div class="card"><div class="card-title">'+cat+' ('+list.length+'个)</div>';
    list.forEach(f=>{
      html+='<div style="padding:10px;border:1px solid var(--border);border-radius:8px;margin:8px 0">';
      html+='<div style="font-weight:600;font-size:.88rem;color:var(--primary-dark);margin-bottom:6px">'+f.name+'</div>';
      html+='<div style="font-family:monospace;font-size:.84rem;background:#f1f5f9;padding:10px;border-radius:6px;margin:6px 0;white-space:pre-wrap">'+f.formula+'</div>';
      html+='<div style="font-size:.78rem;color:var(--text-s);margin:4px 0">'+f.desc+'</div>';
      if(f.ex)html+='<div style="font-size:.75rem;color:var(--primary);background:#eff6ff;padding:6px 8px;border-radius:4px;margin-top:4px">例：'+f.ex+'</div>';
      html+='</div>';
    });
    html+='</div>';
  });
  if(!html)html='<div class="card" style="text-align:center"><p style="color:var(--text-s)">未找到匹配的公式</p></div>';
  $('formula-list').innerHTML=html;
}

// ===== DATA EXPORT/IMPORT =====
function exportProgress(){
  const db=getDB();
  const data={
    version:1,
    exportDate:new Date().toISOString().slice(0,10),
    learnedTopics:db.learnedTopics||[],
    wrongBook:db.wrongBook||{},
    checkIns:db.checkIns||[],
    checkInStreak:db.checkInStreak||0,
    lastCheckIn:db.lastCheckIn||'',
    quizAnswered:db.quizAnswered||{},
    quizState:db.quizState||{}
  };
  const json=JSON.stringify(data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='si-pm-progress-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('进度已导出');
}

function importProgress(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange=()=>{
    const file=input.files[0];
    if(!file){toast('未选择文件');return;}
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!data.version||!data.learnedTopics){toast('文件格式不正确');return;}
        const db=getDB();
        db.learnedTopics=data.learnedTopics||[];
        db.wrongBook=data.wrongBook||{};
        db.checkIns=data.checkIns||[];
        db.checkInStreak=data.checkInStreak||0;
        db.lastCheckIn=data.lastCheckIn||'';
        db.quizAnswered=data.quizAnswered||{};
        if(data.quizState)db.quizState=data.quizState;
        saveDB(db);
        toast('导入成功，页面将刷新');
        setTimeout(()=>location.reload(),1000);
      }catch(e){toast('文件解析失败：'+e.message);}
    };
    reader.readAsText(file);
  };
  input.click();
}
